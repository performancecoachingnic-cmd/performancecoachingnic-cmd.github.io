// Wächter: kurze Hinweise, sofort berechnet
function watchItems(){
  const out=[],T=targets(),E=eaten(),now=new Date(),nowMin=now.getHours()*60+now.getMinutes(),gs=mealGroups();
  let openN=0;
  gs.forEach(([no,it])=>{
    if(mealState(it[0].name).s!=='open')return;openN++;
    const tm=hm(effTime(+no,it[0].time_of_day));
    if(tm&&nowMin-toMin(tm)>60&&nowMin<23*60+30)out.push({lvl:2,t:`${it[0].name} seit ${tm} offen`,act:`mealMenu(${no})`,lbl:'Eintragen'});
  });
  if(!openN&&nowMin>=20*60){
    if(T.p&&E.p<T.p*0.9)out.push({lvl:2,t:`Protein erst ${Math.round(E.p)} von ${T.p} g, ${Math.round(T.p-E.p)} g fehlen`,act:"coachOpen('Mir fehlen Protein, was empfiehlst du noch?')",lbl:'Rat'});
    if(T.kcal&&E.k>T.kcal+150)out.push({lvl:1,t:`Heute ${Math.round(E.k-T.kcal)} kcal über dem Ziel`});
  }
  const goal=S.set.water_goal_ml||4000,w=waterMl();
  if(nowMin>=14*60&&nowMin<22*60&&w<goal*((nowMin-420)/780)*0.7)out.push({lvl:1,t:`Wasser ${fmt(w/1000,1)} von ${fmt(goal/1000,1)} L, du liegst zurück`,act:'addWater(500)',lbl:'+500'});
  const d=S.days.find(x=>x.day_no===planDay());
  if(d&&!d.is_rest&&nowMin>=19*60+30&&!S.sessions.some(x=>x.day===today()))out.push({lvl:1,t:'Training heute noch nicht gestartet',act:"tab='training';render()",lbl:'Öffnen'});
  try{const pt=planTotals(S.meals);if(T.kcal&&Math.abs(pt.k-T.kcal)>130)out.push({lvl:1,t:`Plan summiert ${Math.round(pt.k)} kcal, Ziel ${T.kcal}`,act:"planOpen('Der Plan passt nicht zum Kcal-Ziel, bitte anpassen.')",lbl:'KI anpassen'})}catch(e){}
  return out.sort((a,b)=>b.lvl-a.lvl).slice(0,3);
}

function insHtml(scope){

const addM=(a,b)=>({k:a.k+b.k,p:a.p+b.p,c:a.c+b.c,f:a.f+b.f});
const DEF_CYC={maintenance:2950,
  types:{low:{label:'Low Day',kcal:1900,p:205,f:50,cf:0,box:0,share:70},moderate:{label:'Moderate Day',kcal:2050,p:200,f:55,cf:0,box:30,share:75},high:{label:'High Day',kcal:3000,p:190,f:40,cf:100,box:120,share:50}},
  schedule:{1:'moderate',2:'moderate',3:'moderate',4:'low',5:'low',6:'high',7:'low'}};
const WDN=['Mo','Di','Mi','Do','Fr','Sa','So'];
function cycFoods(){const fd=re=>S.foods.find(f=>re.test(f.name));return{rice:fd(/reis/i),skyr:fd(/skyr/i),cf:fd(/cornflakes/i),berry:fd(/beeren/i),oil:fd(/oliven/i),ket:fd(/ketchup/i),veg:fd(/gemüse/i),chunky:fd(/chunky/i),hack:fd(/hack/i),spin:fd(/spinat/i)}}
function cycTemplate(){
  const rows=isCycle()?(S.allMeals||[]).filter(m=>m.plan_id===activePlan().id&&m.day_type==='moderate'):S.meals,g={};
  rows.forEach(m=>(g[m.meal_no]??=[]).push(m));
  const find=re=>{const e=Object.entries(g).find(([no,it])=>re.test(it[0].name));return e?{no:+e[0],name:e[1][0].name,time:e[1][0].time_of_day,mode:e[1][0].mode,rows:e[1]}:null};
  return{m1:find(/früh/i),m2:find(/arbeit/i),m3:find(/pre/i),m4:find(/post/i)};
}
const cycAmt=(tpl,k,re,def)=>{const m=tpl[k],r=m&&m.rows.find(x=>x.foods&&re.test(x.foods.name));return r?+r.grams:def};
function genType(t,tpl,ty){
  const F=cycFoods();for(const k of ['rice','skyr','cf','oil'])if(!F[k])return{err:'Im Lebensmittel-Katalog fehlt: '+({rice:'Reis',skyr:'Skyr',cf:'Cornflakes',oil:'Olivenöl'})[k]};
  const hack=cycAmt(tpl,'m2',/hack|rind/i,200),spin=cycAmt(tpl,'m2',/spinat/i,150),veg=cycAmt(tpl,'m4',/gemüse/i,150),ket=cycAmt(tpl,'m4',/ketchup/i,60),chk=cycAmt(tpl,'m4',/chunky/i,6),ber=cycAmt(tpl,'m3',/beeren/i,100);
  const fixed=[[F.hack,hack],[F.spin,spin],[F.veg,veg],[F.ket,ket],[F.chunky,chk],[F.berry,ber]].filter(([f,g])=>f&&g>0);
  let base=fixed.reduce((a,[f,g])=>addM(a,perFood(f,g)),milkMacros(planMilkMl()));
  const cfG=Math.round((+t.cf||0)/5)*5,boxG=Math.round((+t.box||0)/5)*5;
  base=addM(addM(base,perFood(F.cf,cfG)),perFood(F.rice,boxG));
  const rk=F.rice.kcal/100,share=(+t.share||70)/100,sp=F.skyr.protein/100;
  let s=Math.round(Math.max(150,Math.min(1300,(t.p-base.p)/sp))/10)*10,o=0,pre=30,post=0,fin=base,floor=0;
  for(let it=0;it<5;it++){
    let b2=addM(base,perFood(F.skyr,s));
    o=Math.round(Math.max(0,Math.min(40,(t.f-b2.f)/(F.oil.fat/100))));b2=addM(b2,perFood(F.oil,o));
    const tot=Math.max(0,(t.kcal-b2.k)/rk);
    pre=tot<30?30:Math.min(tot,Math.max(30,tot*share));post=tot<30?0:Math.max(0,tot-pre);
    pre=Math.round(pre/5)*5;post=Math.round(post/5)*5;
    fin=addM(b2,perFood(F.rice,pre+post));floor=Math.round(b2.k+30*rk);
    const ds=(t.p-fin.p)/sp;if(Math.abs(ds)<8)break;
    s=Math.round(Math.max(150,Math.min(1300,s+ds))/10)*10;
  }
  const s1=Math.round(s*0.4/10)*10,s2=s-s1,R=(no,key,food,g)=>g>0||key==='m1'?{meal_no:tpl[no].no,name:tpl[no].name,time_of_day:tpl[no].time,mode:tpl[no].mode||null,food_id:food.id,grams:g,day_type:ty}:null;
  const rows=[R('m1','m1',F.cf,cfG),R('m2','m2',F.rice,boxG),R('m2','m2',F.hack,hack),R('m2','m2',F.spin,spin),
    R('m3','m3',F.skyr,s1),R('m3','m3',F.berry,ber),R('m3','m3',F.rice,pre),
    R('m4','m4',F.veg,veg),R('m4','m4',F.ket,ket),R('m4','m4',F.skyr,s2),R('m4','m4',F.chunky,chk),R('m4','m4',F.oil,o),R('m4','m4',F.rice,post)].filter(r=>r&&r.food_id);
  return{rows,tot:{k:Math.round(fin.k),p:Math.round(fin.p),c:Math.round(fin.c),f:Math.round(fin.f)},floor,short:t.kcal<floor,preRice:pre,postRice:post,skyr:s,oil:o};
}
function cycProjection(cfg,totByType){
  const cnt={};for(let d=1;d<=7;d++){const ty=cfg.schedule[d];cnt[ty]=(cnt[ty]||0)+1}
  const avg=Object.entries(cnt).reduce((a,[ty,n])=>a+n*(totByType[ty]||cfg.types[ty].kcal),0)/7,maint=+cfg.maintenance||2950;
  return{avg:Math.round(avg),deficit:Math.round(maint-avg),kgWeek:Math.round((maint-avg)/1100*100)/100,cnt};
}
function genCycle(cfg){
  const tpl=cycTemplate();
  for(const k of ['m1','m2','m3','m4'])if(!tpl[k])return{err:'Im aktuellen Plan fehlt die Mahlzeit "'+({m1:'Frühstück',m2:'Arbeit',m3:'Pre-Workout',m4:'Post-Workout'})[k]+'". Der Assistent baut auf diesen vier Mahlzeiten auf.'};
  const out={rows:[],types:{}},tk={};
  for(const [ty,t] of Object.entries(cfg.types)){const g=genType(t,tpl,ty);if(g.err)return g;out.types[ty]=g;tk[ty]=g.tot.k;g.rows.forEach(r=>out.rows.push(r))}
  out.proj=cycProjection(cfg,tk);return out;
}

function blockList(role){

  const {wk,b,phase}=bw,o=+b.orm,P=(a,i)=>a[Math.min(i,a.length-1)];

  if(role==='heavy'){
    if(phase==='build')return mk(4,3,P(b.heavy||BLK_DEF.heavy,wk-1),'Schwer, Woche '+wk);
    if(phase==='deload')return mk(2,3,b.deload_pct||70,'Deload');

  add('<< /Type /Catalog /Pages 2 0 R >>');add('');

function wkPdfBlob(w){

    sh.filter(x=>(x.dept||'Sonstiges')===dp).forEach(x=>{

}

async function pdFinish(wid){

  const ds=pdDishes(w),food=w.plan.prep_food||{},got=(w.state||{}).prep_w||{};

    for(const [ref,cooked] of Object.entries(got)){

      let alloc=0;d.out.forEach(o=>o.parts.forEach(p=>{if(p.ref===ref)alloc+=p.g}));
      const rest=Math.max(0,Math.round(cooked-alloc*cooked/wg.raw));
      await post('prep_batches',{food_id:fid,raw_g:wg.raw,cooked_g:cooked,remaining_g:rest});

const adjRow=()=>(S.adj||[]).find(a=>a.kind==='meals')||null;
const baseGrams=m=>{const a=adjRow(),v=a&&a.data&&a.data.items?a.data.items[m.id]:null;return v!=null?v:m.grams};
const adjGrams=m=>{const b=baseGrams(m),f=balanceCalc().f[m.id],st=(m.foods&&m.foods.fat>=80)?1:5;return f!=null&&f!==1?Math.max(0,Math.round(b*f/st)*st):b};
const replacedOf=no=>{const a=adjRow();return a&&a.data&&a.data.replaced?(a.data.replaced.find(r=>r.meal_no===no)||null):null};
function adjBanner(){
  const notes=(S.adj||[]).filter(a=>a.kind==='note');

   ${notes.map(n=>`<div style="margin-top:4px">• ${esc(n.note||'')}</div>`).join('')}</div>`;
}
const tomorrowStr=()=>addDays(today(),1);
function baseMeals(d){
  const g={};(d?mealsFor(d):S.meals).forEach(m=>{(g[m.meal_no]??=[]).push(m)});
  return Object.entries(g).map(([no,it])=>({no:+no,items:it,time:hm(it[0].time_of_day)||'99',name:it[0].name})).sort((a,b)=>a.time.localeCompare(b.time));
}
const toMin=t=>parseInt(t.slice(0,2))*60+parseInt(t.slice(3,5));
const fromMin=m=>{m=Math.max(0,Math.min(1439,m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function computeAdjust(ev){
  const ms=baseMeals(tomorrowStr());
  if(!ms.length)return{ok:false,msg:'Kein Mahlzeitenplan vorhanden, der Umbau der Mahlzeiten ist nicht möglich.'};
  const T=targets(tomorrowStr()),milk=milkMacros(planMilkMl()),replaced=[];
  const lastM=ms[ms.length-1],lunchM=ms.find(m=>m.time>='11:00'&&m.time<='15:00')||ms[1]||null;
  const mk=(m,x,tag)=>({meal_no:m.no,label:m.name+' ('+tag+')',kcal:+x.kcal||0,p:+x.p||0,c:+x.c||0,f:+x.f||0});
  if(ev.dinner&&ev.dinner.on)replaced.push(mk(lastM,ev.dinner,'auswärts'));
  if(ev.lunch&&ev.lunch.on&&lunchM&&!replaced.some(r=>r.meal_no===lunchM.no))replaced.push(mk(lunchM,ev.lunch,'auswärts'));
  if(!replaced.length)return{ok:true,replaced:[],items:{},changes:[],warn:[]};
  const repNos=new Set(replaced.map(r=>r.meal_no)),milkId=S.set.milk_food_id,rows=[];
  ms.filter(m=>!repNos.has(m.no)).forEach(m=>m.items.forEach(it=>{
    const f=it.foods;if(!f)return;const x=it.grams/(f.per_g||100);
    rows.push({it,f,m,k:f.kcal*x,p:f.protein*x,c:f.carbs*x,fat:f.fat*x,scal:f.carbs>=15&&f.id!==milkId});
  }));
  const ext=replaced.reduce((a,r)=>({k:a.k+r.kcal,p:a.p+r.p,c:a.c+r.c,f:a.f+r.f}),{k:0,p:0,c:0,f:0});
  const curK=rows.reduce((a,r)=>a+r.k,0),scalK=rows.filter(r=>r.scal).reduce((a,r)=>a+r.k,0);
  const cutK=T.kcal?curK+ext.k+milk.k-T.kcal:0;
  const cut=cutK>0&&scalK>0?Math.min(0.9,cutK/scalK):0,items={},changes=[];
  replaced.forEach(rp=>changes.push(`${rp.label}: ${Math.round(rp.kcal)} kcal, P${Math.round(rp.p)} C${Math.round(rp.c)} F${Math.round(rp.f)}`));
  let K=ext.k+milk.k,P=ext.p+milk.p,C=ext.c+milk.c,F=ext.f+milk.f;
  rows.forEach(r=>{
    let g=r.it.grams;
    if(r.scal&&cut>0){const ng=Math.round(g*(1-cut)/5)*5;if(ng!==g){items[r.it.id]=ng;changes.push(`${r.f.name} (${r.m.name}): ${g} g → ${ng} g`);g=ng}}
    const x=g/(r.f.per_g||100);K+=r.f.kcal*x;P+=r.f.protein*x;C+=r.f.carbs*x;F+=r.f.fat*x;
  });
  const warn=[];
  if(T.p&&P<T.p*0.9)warn.push(`Protein ${Math.round(P)} g von ${T.p} g: Lücke ${Math.round(T.p-P)} g, eine Proteinquelle ergänzen.`);
  if(T.kcal&&cutK>0&&cut>=0.9)warn.push('Die Carbs der übrigen Mahlzeiten reichen nicht, um die Kcal zu halten. Der Tag liegt über dem Ziel.');
  if(T.f&&F>T.f+10)warn.push(`Fett ${Math.round(F)} g liegt ${Math.round(F-T.f)} g über dem Ziel von ${T.f} g.`);
  if(!T.kcal)warn.push('Kein Kcal-Ziel gesetzt, es wird nur die Mahlzeit ersetzt.');
  return{ok:true,replaced,items,changes,warn,tot:{k:K,p:P,c:C,f:F},T};
}
function timeOverrides(ev){
  const ms=baseMeals(),out=[];if(!ms.length)return out;
  if(ev.late&&ev.late.on&&ev.late.time){
    const delta=toMin(ev.late.time)-toMin(ms[0].time);
    ms.forEach(m=>out.push({meal_no:m.no,time:fromMin(toMin(m.time)+delta)}));
  }
  if(ev.traintime&&ev.traintime.on&&ev.traintime.time&&ms.length>=2){
    const t=toMin(ev.traintime.time),post=ms[ms.length-1],pre=ms[ms.length-2];
    const set=(m,tm)=>{const i=out.findIndex(o=>o.meal_no===m.no);if(i>=0)out[i].time=tm;else out.push({meal_no:m.no,time:tm})};
    set(pre,fromMin(t-75));set(post,fromMin(t+150));
  }
  return out;
}

const b64=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};

  if(!s.next_phase||!s.next_phase_date||s.next_phase_date>today())return;
  const k=(s.phase_kcal||{})[s.next_phase];
  await patch('settings','device_key=eq.'+KEY,{phase:s.next_phase,target_rate:s.next_rate??s.target_rate,...(k?{kcal_target:k}:{}),next_phase:null,next_phase_date:null,next_rate:null});
  if(k)await post('kcal_history',{old_kcal:s.kcal_target,new_kcal:k,reason:'Phasenwechsel: '+s.next_phase,status:'angenommen'});
  await load();
}
function readCache(){
  try{const j=JSON.parse(LS.get('bb_raw')||'null');if(j&&j.k===KEY&&j.d===today()&&j.r&&j.r.settings){RAW=j.r;RAWDAY=j.d;return true}}catch(e){}return false;
}
const splashGate=()=>new Promise(r=>{if(!document.getElementById('splash'))return r();setTimeout(r,Math.max(0,SP_MIN-350-(Date.now()-SP0)))});
async function boot(){
  let cached=false;
  try{if(KEY){restoreUI();cached=readCache();if(cached){buildS()}else{await loadRaw(true);buildS();saveRawSoon();await loadIns();await applyScheduled();if(!S.set.device_key){alert('Schlüssel unbekannt');KEY='';LS.del('bbkey')}}}}catch(e){alert('Fehler: '+e.message)}
  await splashGate();
  render();
  const a=document.getElementById('app');if(a&&window.__sc){a.scrollTop=window.__sc;window.__sc=0;updateFab()}
  wtResume();hideSplash();
  if(cached)setTimeout(async()=>{
    try{const ch=await refreshAll();await loadIns();await applyScheduled();
      if(!S.set.device_key){alert('Schlüssel unbekannt');KEY='';LS.del('bbkey');LS.del('bb_raw');render();return}
      if(ch&&!uiBusy()){const b=document.getElementById('app'),sc=b?b.scrollTop:0;render();if(b)b.scrollTop=sc}}catch(e){}
  },1800);
}
// Intro: laeuft einmal komplett durch, danach oeffnet sich die App
const SP0=Date.now(),SP_MIN=1600;let _spHide=false;
function hideSplash(force){
  const sp=document.getElementById('splash');if(!sp||_spHide)return;_spHide=true;
  const wait=force?0:Math.max(0,SP_MIN-(Date.now()-SP0));
  setTimeout(()=>{document.body.classList.remove('spl');document.documentElement.classList.remove('spl');sp.classList.add('out');setTimeout(()=>sp.remove(),520)},wait);
}
setTimeout(()=>hideSplash(true),4000);
if('serviceWorker' in navigator)navigator.serviceWorker.register(location.pathname.indexOf('/neu/')>=0?'../sw.js':'sw.js').catch(()=>{});
boot();
async function checkUpdate(){
  if(BUILD==='dev')return;
  try{const r=await fetch('index.html?cb='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=await r.text(),m=t.match(/const BUILD='([^']*)'/);
    if(m&&m[1]&&m[1]!==BUILD){if(document.activeElement&&/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))return;try{const rg=await navigator.serviceWorker.getRegistration();if(rg)await rg.update()}catch(e){}saveUI();try{sessionStorage.setItem('nosplash','1')}catch(e){}location.reload()}}catch(e){}
}
let _hiddenAt=0;
document.addEventListener('visibilitychange',async()=>{
  if(!KEY)return;
  if(document.visibilityState==='hidden'){_hiddenAt=Date.now();saveUI();return}
  if(Date.now()-_hiddenAt<20000)return;
  const a=document.getElementById('app'),sc=a?a.scrollTop:0;
  try{await checkUpdate();const ch=await refreshAll();await loadIns();if(ch&&!uiBusy()){render();const b=document.getElementById('app');if(b)b.scrollTop=sc}}catch(e){}
});
window.addEventListener('pagehide',saveUI);
document.getElementById('app').addEventListener('scroll',()=>{updateFab();saveUISoon()},{passive:true});
window.addEventListener('resize',updateFab);
setInterval(checkUpdate,10*60*1000);setTimeout(checkUpdate,4000);

// Leiste unten verstecken, solange die Tastatur offen ist (sonst springt sie bei iOS mitten ins Bild)
(function(){
  const isField=el=>!!el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName);
  document.addEventListener('focusin',e=>{if(isField(e.target))document.body.classList.add('kb')});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(!isField(document.activeElement))document.body.classList.remove('kb')},80));
})();

// Kein Hineinzoomen: Pinch-Gesten abfangen (Doppeltipp-Zoom verhindert touch-action: manipulation, schnelle +/- Taps bleiben möglich)
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
</script>
