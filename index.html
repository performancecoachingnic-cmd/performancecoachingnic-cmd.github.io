/* Neues Design: Salbei, ruhig, Zeitleiste, JETZT-Kasten */
:root{--bg:#ffffff;--card:#ffffff;--card2:#ffffff;--line:#dcdcd8;--tx:#2f2e2b;--mut:#8b8a86;--ac:#2383e2;--acx:#ffffff;--hero:#f1f6fd;--ac2:#2383e2;--acl:#2383e2;--acg:rgba(35,131,226,.18);--ok:#2f2e2b;--warn:#b86e12;--r:8px;--pad:14px;--gap:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.rtb{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;padding:8px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.rtb .rtl{color:var(--mut);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.rtb b{font-size:46px;line-height:1.05;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
.rtb.rt0 b{color:var(--warn)}
html{background:var(--bg);height:100%;overflow:hidden;max-width:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;height:100dvh;overflow:hidden;max-width:100%;position:relative;display:flex;flex-direction:column;background:var(--bg);overscroll-behavior:none;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.4px;font-weight:700}
h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:20px 2px 8px}
main{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-x:none;max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px max(16px,calc((100% - 640px)/2)) calc(140px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:0;border-radius:var(--r);padding:var(--pad);margin-bottom:var(--gap)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid transparent;border-radius:12px;padding:11px 12px;font-size:16px;width:100%;min-width:0;min-height:46px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac2)}
button{background:var(--ac);color:var(--acx);border:0;border-radius:14px;padding:11px 16px;font-weight:700;font-size:15px;min-height:46px;font-family:inherit}
button{transition:transform .08s}button:active{transform:scale(.97)}
button.g{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:600}
button.s{max-width:100%;padding:7px 12px;font-size:13px;min-height:36px;border-radius:12px}
nav{flex:none;position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:2px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:6}body.kb nav{display:none}
nav button{flex:1;background:none;color:var(--mut);border-radius:14px;padding:6px 2px;font-size:11px;font-weight:600;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button span{display:block}
nav button.on{color:var(--tx);font-weight:800}nav button.on svg{color:var(--ac2)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2);border-radius:6px}
.mut{color:var(--mut);font-size:13px}.big{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.4px}.ok{color:var(--ok)}.warn{color:var(--warn)}
.set{display:grid;grid-template-columns:26px 1fr 1fr auto;gap:8px;align-items:center;margin-top:6px}
.pe{display:grid;grid-template-columns:1fr 52px 52px 52px 56px;gap:4px;margin-top:6px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.pill{display:inline-block;background:var(--bg);border-radius:99px;padding:3px 10px;font-size:11px;color:var(--mut)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}
#timer{display:none}
#modal{position:absolute;inset:0;background:rgba(10,20,14,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal .box{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
details summary{cursor:pointer;color:var(--mut);margin:8px 0}
.fold{padding:12px 14px}.fold>summary{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0;color:var(--tx);font-weight:700;list-style:none;font-size:15px}
.fold>summary::-webkit-details-marker{display:none}.fold>summary::after{content:'›';color:var(--mut);font-size:22px;transform:rotate(90deg);transition:transform .15s}
.fold[open]>summary::after{transform:rotate(-90deg)}.fold .fs{color:var(--mut);font-weight:400;font-size:13px;margin-left:auto;text-align:right}
.fold>.fb{margin-top:12px}.fold>.fb .card{background:transparent;border:0;padding:0;margin-bottom:10px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:3px;margin:2px 0 14px;gap:0}.seg button{flex:1;padding:8px 2px;font-size:13px;min-height:38px;border-radius:11px;background:transparent;color:var(--mut);font-weight:600}
.seg button.g{background:transparent;border:0;color:var(--mut)}
.seg button:not(.g){background:var(--hero);color:#fff}
.sug{outline:1px solid var(--warn)}
.score{display:flex;justify-content:space-between;align-items:center;gap:12px}.score .big{font-size:40px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tli{position:relative;display:block;margin-bottom:12px}
.tli::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
.tli.due::before{border-color:var(--ac2);background:var(--ac2)}
.tli.done::before{border-color:var(--ok);background:var(--ok)}
.tt{width:auto;font-weight:700;font-size:12px;padding:0 0 2px;color:var(--mut);background:none}
.tli.due .tt{color:var(--ac2)}
.tc{min-width:0;background:none;border:0;padding:0 0 4px}
.tli.done .tc{opacity:.55}
.menu{display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer}
.menu b{font-size:16px}.menu .mut{margin-top:2px}.menu .ch{font-size:24px;color:var(--mut)}
.wc{padding:12px;margin-top:0}.wn{font-size:24px;font-weight:800}.wc .bar{margin-top:8px}
.wrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.wrow .s{min-height:34px;padding:5px 9px;font-size:13px}.wrow input{width:58px;min-height:34px;padding:5px 6px;font-size:14px;text-align:center}
.nx{background:var(--hero);color:#fff;border-radius:22px;padding:16px;margin-bottom:12px}
.nx button{background:var(--ac);color:var(--acx)}
.nx button.g{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.nxl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin-bottom:4px}
.nxt{font-size:20px;font-weight:700;line-height:1.25}.nxs{font-size:13px;opacity:.78;margin-top:3px}
.nxd{margin-top:8px}.nxd summary{color:#fff;opacity:.8;margin:0}
.nxd input{background:rgba(255,255,255,.12);color:#fff}
.nxd .mut{color:rgba(255,255,255,.7)}
.tsec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 2px}
.trow{border-bottom:1px solid var(--line)}
.trow summary{display:flex;gap:10px;align-items:center;padding:11px 2px;margin:0;color:var(--tx);list-style:none}
.trow summary::-webkit-details-marker{display:none}
.trt{width:44px;color:var(--mut);font-size:13px;font-weight:700;flex:none}
.trn{flex:1;min-width:0}.trc{color:var(--ok)}
.trb{padding:0 2px 12px 54px}
.tdone .trn{color:var(--mut)}
.tdw{margin-top:8px}.tdw>summary{color:var(--mut);margin:6px 0;padding:6px 2px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}.mrow .mn{min-width:0}.mrow .mn span{font-weight:700;margin-left:4px}
.mrow .ms{color:var(--mut);font-size:13px;text-align:right;flex:none;max-width:48%}
.mrow.off{opacity:.45}
[style*="overflow-x:auto"]{overscroll-behavior-x:contain}
.trq{margin-left:auto;flex:none}.trq button{min-height:34px;padding:6px 12px;font-size:13px;border-radius:12px}
/* neu */
.nums{display:flex;gap:8px;margin-bottom:12px}.nums>div{flex:1;background:var(--card);border-radius:16px;padding:11px 12px;min-width:0}
.nums b{font-size:20px;display:block;letter-spacing:-.3px}.nums small{color:var(--mut);font-size:11px}.nums .bar{margin-top:7px}
.ev{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}.ev:first-child{border-top:0}
.ev .tm{width:42px;font-size:12px;color:var(--mut);padding-top:3px;flex:none}
.ev .dot{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:5px;flex:none}
.ev.done .dot{background:var(--ok)}.ev.now .dot{background:var(--ac2);box-shadow:0 0 0 4px var(--acg)}
.ev b{font-size:15px;display:block}.ev.done b{opacity:.55}.ev .mt{color:var(--mut);font-size:12px}
.fab{position:absolute;right:14px;bottom:78px;width:42px;height:42px;border-radius:50%;background:var(--hero);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:5;border:0;padding:0;min-height:0}

/* Training neu */
.in{background:var(--bg);border-radius:12px;padding:11px 8px;text-align:center;font-weight:700;min-height:46px;display:flex;align-items:center;justify-content:center}

.set input{text-align:center;font-weight:700;font-size:17px}
.exh{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.exh b{font-size:16px}
.spark{height:56px;display:flex;align-items:flex-end;gap:4px;margin-top:8px}.spark i{flex:1;background:var(--ac2);border-radius:3px 3px 0 0;opacity:.8;min-height:3px}

/* Ladebildschirm: Muenze schlaegt ein (Funken, Splitter, Brocken, Risse, Strahlen, Schockwellen), Titel knallt rein. Nur CSS. */
html.spl,body.spl{background:#050505!important}
body.spl main,body.spl #hdr,body.spl nav{visibility:hidden}
#splash{position:fixed;inset:0;z-index:99;background:#050505;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#splash .spw{position:absolute;inset:-60px;background:#050505;display:flex;align-items:center;justify-content:center;animation:spShake .65s .46s both}
#splash .spg{position:absolute;inset:0;background:radial-gradient(60% 38% at 50% 44%,rgba(201,161,58,.3),transparent 72%),radial-gradient(95% 75% at 50% 50%,transparent 45%,rgba(0,0,0,.88));animation:spGl .6s .46s ease-out both}
#splash .spm{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;margin-top:-4vh;animation:spPunch .5s .46s ease-out both}
#splash .spcw{position:relative;width:min(84vw,380px)}
#splash .spcoin{display:block;width:100%;height:auto;filter:drop-shadow(0 20px 22px rgba(0,0,0,.75));animation:spDrop .8s both}
#splash .spring,#splash .spring2{position:absolute;inset:6%;border-radius:50%;border:4px solid #f6d77a;box-shadow:0 0 22px 4px rgba(246,215,122,.75);opacity:0;animation:spRing .6s .46s ease-out forwards}
#splash .spring2{border-width:2px;animation:spRing2 .8s .56s ease-out forwards}
#splash .spray{position:absolute;left:50%;top:50%;width:110vmax;height:110vmax;margin:-55vmax 0 0 -55vmax;border-radius:50%;background:repeating-conic-gradient(from 7deg,rgba(255,229,150,.75) 0 3.5deg,transparent 3.5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);opacity:0;pointer-events:none;animation:spRay .55s .46s ease-out forwards}
#splash .spcr{position:absolute;left:50%;top:50%;width:150vw;height:150vw;margin:-75vw 0 0 -75vw;pointer-events:none;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,200,80,.95))}
#splash .spcr path{fill:none;stroke:#ffe6a0;stroke-width:.55;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:spCr .9s var(--t) ease-out both}
#splash .sk{position:absolute;left:50%;top:52%;width:var(--s,5px);height:var(--s,5px);margin:-2px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 8px 2px rgba(255,200,80,.95);opacity:0;pointer-events:none;animation:spSk .85s var(--t) cubic-bezier(.2,.7,.4,1) both}
#splash .db{position:absolute;left:50%;top:52%;width:var(--s);height:calc(var(--s)*.75);margin:-6px;background:linear-gradient(135deg,#eef0f4,#2a2d33);clip-path:polygon(0 25%,60% 0,100% 55%,40% 100%);opacity:0;pointer-events:none;animation:spDb 1s var(--t) cubic-bezier(.2,.7,.4,1) both}
#splash .sl{position:absolute;left:50%;top:52%;width:var(--l);height:2px;margin-top:-1px;transform-origin:0 50%;background:linear-gradient(90deg,transparent,#fff3c8 70%,#fff);border-radius:2px;opacity:0;pointer-events:none;filter:drop-shadow(0 0 4px rgba(255,200,80,.9));animation:spSl .5s var(--t) cubic-bezier(.1,.8,.3,1) both}
#splash .spfl{position:absolute;inset:0;background:#fff6dc;opacity:0;pointer-events:none;animation:spFl .38s .46s ease-out forwards}
#splash .spfl2{position:absolute;inset:0;background:#ffe7a8;opacity:0;pointer-events:none;animation:spFl2 .3s .56s ease-out forwards}
#splash .spt{margin-top:5vh;font-weight:900;font-style:italic;font-size:min(10.4vw,54px);letter-spacing:.01em;white-space:nowrap;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.95) 50%,transparent 58%) 140% 0/260% 100% no-repeat,linear-gradient(180deg,#fff6c9 0%,#f2cd62 32%,#8a6414 50%,#d8a73f 62%,#ffe9a0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 5px rgba(0,0,0,.8)) drop-shadow(0 0 12px rgba(255,190,70,.45));opacity:0;animation:spTit .42s .5s both,spShine .55s .92s ease-in-out both}
#splash .sps{margin-top:12px;font-weight:800;font-size:min(3.3vw,13px);letter-spacing:.3em;padding-left:.3em;white-space:nowrap;background:linear-gradient(90deg,#8a6a14,#f6e08a,#8a6a14);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:spSub .35s .78s ease-out both}
#splash .spb{position:absolute;left:0;right:0;margin:auto;bottom:calc(env(safe-area-inset-bottom) + 8vh + 60px);width:min(34vw,150px);height:3px;background:rgba(201,161,58,.2);overflow:hidden}
#splash .spb i{display:block;width:45%;height:100%;background:linear-gradient(90deg,transparent,#f6d77a,transparent);animation:spBar .9s ease-in-out infinite}
#splash.out{animation:spOut .3s ease-in forwards!important}
@keyframes spDrop{0%{transform:translateY(-80vh) scale(1.5) rotate(-28deg);opacity:0;animation-timing-function:cubic-bezier(.6,0,.95,.55)}8%{opacity:1}57%{transform:translateY(0) scale(1) rotate(0);animation-timing-function:ease-out}66%{transform:translateY(-22px) scale(1.02) rotate(-3deg)}77%{transform:translateY(0) rotate(2deg)}86%{transform:translateY(5px) scale(1.04,.96) rotate(-1deg)}100%{transform:none;opacity:1}}
@keyframes spRing{0%{opacity:1;transform:scale(.45)}100%{opacity:0;transform:scale(2.9)}}
@keyframes spRing2{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(3.6)}}
@keyframes spRay{0%{opacity:1;transform:scale(.3) rotate(0)}100%{opacity:0;transform:scale(1) rotate(14deg)}}
@keyframes spFl{0%{opacity:.95}100%{opacity:0}}
@keyframes spFl2{0%{opacity:.55}100%{opacity:0}}
@keyframes spPunch{0%{transform:scale(1.16)}100%{transform:none}}
@keyframes spGl{0%{filter:brightness(2.6)}100%{filter:none}}
@keyframes spShake{0%,100%{transform:none}8%{transform:translate(-16px,12px)}18%{transform:translate(15px,-12px)}28%{transform:translate(-13px,10px)}38%{transform:translate(11px,-9px)}50%{transform:translate(-8px,6px)}62%{transform:translate(6px,-5px)}76%{transform:translate(-3px,3px)}88%{transform:translate(1px,-1px)}}
@keyframes spTit{0%{opacity:0;transform:scale(2.6) translateX(0)}30%{opacity:1;transform:scale(.93)}46%{transform:scale(1.05) translateX(-7px)}60%{transform:scale(1) translateX(6px)}74%{transform:translateX(-3px)}100%{opacity:1;transform:none}}
@keyframes spShine{from{background-position:140% 0,0 0}to{background-position:-40% 0,0 0}}
@keyframes spSub{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

function avg(a,b){
  const xs=S.bw.filter(x=>{const ago=Math.round((new Date(today())-new Date(x.day))/864e5);return ago>=a&&ago<=b});
  return xs.length?{v:xs.reduce((s,x)=>s+ +x.kg,0)/xs.length,n:xs.length}:null;
}
function suggestion(force){
  return null;
  if(isCycle()||planHasTargets())return null;
  const s=S.set,A=avg(0,6),B=avg(7,13);
  if(!A||!B||A.n<3||B.n<3)return null;
  const l=S.kh[0];if(!force&&l&&Date.now()-new Date(l.created_at)<7*864e5)return null;
  const t=targets();if(!t.kcal)return null;
  const rate=A.v-B.v,diff=rate-(+s.target_rate||0),tol=+s.tolerance||0.15;
  if(Math.abs(diff)<=tol)return{ok:true,rate};
  const cap=+s.step_cap||150;
  let d=Math.round(Math.max(-cap,Math.min(cap,-diff*1100))/25)*25;
  if(d===0)return{ok:true,rate};
  let nk=t.kcal+d;const minK=t.p*4+t.f*9+(+s.min_carbs||120)*4;
  if(nk<minK){nk=minK;d=nk-t.kcal;if(d>=0)return{ok:true,rate,floor:true}}
  return{rate,diff,d,nk,old:t.kcal};
}
function sugCard(){

  const t=targets(),nc=Math.round((g.nk-t.p*4-t.f*9)/4);

function score(){

  const trained=S.sessions.some(s=>s.day===today()),day=S.days.find(d=>d.day_no===planDay()),p=[];
  p.push((day&&day.is_rest)||planDay()==null?1:trained?1:0);p.push(Math.min(1,e.p/t.p));
  if(t.kcal)p.push(Math.max(0,1-Math.abs(e.k-t.kcal)/t.kcal*4));
  p.push(ms.length?done/ms.length:1);p.push(S.bw.some(b=>b.day===today())?1:0);p.push(Math.min(1,waterMl()/(S.set.water_goal_ml||4000)));
  return Math.round(p.reduce((a,b)=>a+b,0)/p.length*100);
}

const MET={tr:[44,72,50],es:[270,46,46],kb:[180,55,42],sp:[360,100,24],wa:[210,42,46]};
function metalVars(k){
  const [h,s,l]=MET[k],g=.63,c=v=>Math.max(0,Math.min(100,v)),H=(a,b)=>`hsl(${h},${Math.round(c(a))}%,${Math.round(c(b))}%)`;
  const dk=H(s,Math.max(7,l*(.66-.3*g))),md=H(s,l),lt=H(s*(1-.5*g),Math.min(95,l+16+36*g)),hi=H(s*.3,Math.min(99,l+30+60*g)),m2=H(s,l*.92);
  const grad=`repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.05) 1px 3px),linear-gradient(155deg,${dk} 0%,${md} 30%,${lt} 50%,${m2} 72%,${dk} 100%)`;
  const con=`conic-gradient(from 155deg,${dk},${hi},${md},${lt},${dk},${md},${dk})`;

  const planNames=new Set(gs.map(([no,it])=>it[0].name));

  gs.forEach(([no,it])=>{

    const act=eaten?logSum(logs):null,mac=eaten?act:plan;
    if(eaten)done=add(done,act);else open=add(open,plan);
    const d={k:plan.k-base.k,p:plan.p-base.p,c:plan.c-base.c,f:plan.f-base.f};

  });

  const other=S.flog.filter(l=>!planNames.has(l.meal_name)&&l.meal_name!=='Proteinmilch');

  const total=add(done,open),pct=(v,m)=>m?Math.min(100,v/m*100):0;

// Hinweis (kein Ziel): letzter Wert dieser Übung an einem anderen Trainingstag
function lastElse(name,excludeSession,dayId){

    const r=(se.sets||[]).filter(x=>x.exercise===name&&x.reps>0).sort((a,b)=>a.set_no-b.set_no);
    if(r.length){const dy=S.days.find(x=>x.id===se.day_id);return{sets:r,day:dy?dy.name:'anderer Tag'}}}

function setTarget(e,last,i){
  if(e.blk&&e.blk[i])return e.blk[i];
  if(!last||!last.length)return null;
  if(e.fs_max){const b0=last[i]||last[last.length-1];return{w:+b0.weight_kg||0,r:+b0.reps,why:'Full Stack erreicht, keine Steigerung'}}
  const lo=e.rep_min||6,hi=e.rep_max||10,inc=+e.inc_kg||2.5,b=last[i]||last[last.length-1],w=+b.weight_kg||0,r=+b.reps;
  if(!(w>0))return{w:0,r:r+1,why:'Full Stack: +1 Wiederholung'};
  if(r>=hi)return{w:Math.round((w+inc)*100)/100,r:lo,why:'Obergrenze erreicht, Gewicht erhöhen'};
  return{w,r:r+1,why:'+1 Wiederholung zum letzten Mal'};

function exCard(e,sess,d){
  const rows=setRows(sess,e.name),last=lastFor(e.name,sess&&sess.id,d),extra=trExtra[e.id]||0,planned=e.sets||0;
  const total=Math.max(planned+extra,rows.length,1),note=(S.notes||[]).find(n=>n.exercise===e.name),isOpen=trOpen&&trOpen.has(e.id);
  const oth=last?null:lastElse(e.name,sess&&sess.id,e.day_id);
  const lastTxt=last?last.map(x=>wt(x.weight_kg)+'×'+x.reps).join(' · '):'noch keine Einheit an diesem Tag'+(oth?`<br><span style="opacity:.7">Hinweis ${esc(oth.day)}: ${oth.sets.map(x=>wt(x.weight_kg)+'×'+x.reps).join(' · ')} (kein Ziel)</span>`:'');
  let tgTxt='';
  const t0=setTarget(e,last,rows.length);if(t0)tgTxt=`${wt(t0.w)} × ${t0.r}`;
  // Progressive Overload: alle Ziele des Tages zeigen, bei erreichter Obergrenze klar "Gewicht erhöhen" sagen
  const tgs=last?Array.from({length:Math.max(total,1)},(_,k)=>setTarget(e,last,k)):[],isUp=t=>t&&/erhöhen/.test(t.why||'');
  const poHtml=tgs.some(t=>t)?`${tgs.some(isUp)?`<div style="margin-top:6px;padding:6px 10px;border-radius:8px;background:rgba(240,180,40,.18);font-weight:800">⬆ Obergrenze erreicht: heute Gewicht erhöhen</div>`:''}<div class="mut" style="margin-top:4px">Ziele: ${tgs.map((t,k)=>t?(k+1)+') '+wt(t.w)+' × '+t.r+(isUp(t)?' ⬆':''):'').filter(Boolean).join(' · ')}</div>`:'';
  let sets='';
  for(let k=0;k<total;k++){
    const r=rows[k];
    if(r){sets+=`<div class="set"><span class="mut">${k+1}</span><div class="in done">${r.reps>0?wt(r.weight_kg)+(+r.weight_kg>0?' kg':''):'–'}</div><div class="in done">${r.reps>0?r.reps:'übersprungen'}</div><button class="chk ok" aria-label="Rückgängig" onclick="trUndo(${r.id},${e.id})">✓</button></div>`;continue}
    const tg=setTarget(e,last,k),prev=rows.filter(x=>x.reps>0).at(-1),w=tg?tg.w:(prev?+prev.weight_kg:null),rp=tg?tg.r:(prev?prev.reps:null);
    const dv=drafts()[e.id+'_'+k];
    sets+=`<div class="set"><span class="mut">${k+1}</span><input id="tw${e.id}_${k}" type="text" inputmode="decimal" placeholder="kg" value="${dv?esc(dv.w):(w!=null?nf(w):'')}" oninput="setDraft(${e.id},${k})"><input id="tr${e.id}_${k}" type="number" inputmode="numeric" placeholder="Wdh" value="${dv?esc(dv.r):(rp??'')}" oninput="setDraft(${e.id},${k})"><button class="chk" aria-label="Satz speichern" onclick="trSave(${e.id},${k})">✓</button></div>`;
  }
  const doneN=rows.length;
  return `<details class="card fold" ${isOpen?'open':''} ontoggle="trToggle(${e.id},this.open)"><summary><span class="exh"><b>${esc(e.name)}</b></span><span class="fs">${doneN}/${Math.max(planned,doneN)} · ${planned} × ${e.rep_min}${e.rep_max!==e.rep_min?'–'+e.rep_max:''}</span></summary><div class="fb">
    ${e.blk?`<div class="mut" style="color:var(--ac2);font-weight:600;margin-bottom:4px">${esc(e.blk[0].why)}</div>`:(e.rep_note?`<div class="mut" style="margin-bottom:4px">${esc(e.rep_note)}</div>`:'')}
    <div class="mut">Letztes Mal: ${lastTxt}${tgTxt?'<br>'+(e.fs_max?'Full Stack erreicht, keine Steigerung: <b>':'Ziel heute: <b>')+tgTxt+'</b>':''}</div>${poHtml}
    <div class="mut" style="display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;margin-top:8px;font-size:11px"><span></span><span style="text-align:center">kg (0 = FS)</span><span style="text-align:center">Wdh.</span><span></span></div>
    ${sets}
    <div class="row wrap" style="margin-top:10px"><button class="g s" onclick="skipSet(${e.id})">Satz überspringen</button><button class="g s" onclick="trExtra[${e.id}]=(trExtra[${e.id}]||0)+1;trOpen=trOpen||new Set();trOpen.add(${e.id});render()">+ Zusatzsatz</button><button class="g s${e.fs_max?' on':''}" onclick="trMax(${e.id})">${e.fs_max?'✓ Full Stack':'Full Stack'}</button></div>
    <details style="margin-top:8px" ${drafts()['n'+e.id]!=null?'open':''}><summary>Notiz zur Übung</summary><textarea rows="2" placeholder="z.B. Maschineneinstellung, Griffbreite" oninput="putDraft('n${e.id}',this.value)" onchange="saveNote(${e.id},this.value);putDraft('n${e.id}',null)">${esc(drafts()['n'+e.id]!=null?drafts()['n'+e.id]:(note?note.note:''))}</textarea></details>
  </div></details>`;
}

const RT_SEC=120;let RT={end:0,h:null};
try{const e=+SS.get('rt_end');if(e&&Date.now()-e<3*36e5)RT.end=e}catch(e){}
const rtLeft=()=>RT.end?Math.max(0,Math.round((RT.end-Date.now())/1000)):null;
const rtText=()=>{const l=rtLeft();return l==null?'':Math.floor(l/60)+':'+String(l%60).padStart(2,'0')};
function rtTick(){
  clearInterval(RT.h);
  RT.h=setInterval(()=>{const el=document.getElementById('rtv'),b=document.getElementById('rtb'),l=rtLeft();
    if(el)el.textContent=rtText();if(b)b.classList.toggle('rt0',l===0);
    if(l===0||l==null)clearInterval(RT.h)},500);
}
function rtStart(){RT.end=Date.now()+RT_SEC*1000;SS.set('rt_end',String(RT.end));rtTick()}
function rtStop(){RT.end=0;clearInterval(RT.h);SS.del('rt_end')}
function rtBar(){
  if(!RT.end)return '';
  const l=rtLeft();if(l>0)rtTick();
  return `<div id="rtb" class="rtb${l===0?' rt0':''}"><span class="rtl">Satzpause</span><b id="rtv">${rtText()}</b></div>`;
}

async function ensureSession(d){
  let s=S.sessions.find(x=>x.day===today()&&x.day_id===d);
  if(!s){s=(await post('sessions',{day_id:d,day:today()}))[0];s.sets=[];s.allSets=[];S.sessions.unshift(s)}return s}
async function addSet(exId){
  if(trBusy)return;
  const e=S.ex.find(x=>x.id===exId),w=num($('#w'+exId).value),r=parseInt($('#r'+exId).value);
  if(isNaN(w)||isNaN(r)||w<0||r<=0||r>100){alert('Bitte Gewicht (0 = Full Stack) und Wiederholungen (mindestens 1) eintragen.');return}
  trBusy=true;
  await run(async()=>{
    const s=await ensureSession(e.day_id);
    await post('sets',{session_id:s.id,exercise:e.name,set_no:nextSetNo(s,e.name),weight_kg:Math.round(w*100)/100,reps:r});
    const was=fxEx;await load();advanceIfDone(e);render();if(fxEx!==was)scrollTo(0,0)});
  trBusy=false}
function stepVal(id,d){const el=document.getElementById(id);if(!el)return;const v=num(el.value)||0;
  el.value=id[0]==='w'?nf(Math.max(0,Math.round((v+d)*100)/100)):String(Math.max(0,Math.round(v+d)))}
async function skipSet(exId){
  if(trBusy)return;trBusy=true;clearDrafts(exId);
  const e=S.ex.find(x=>x.id===exId);
  await run(async()=>{const s=await ensureSession(e.day_id);
    await post('sets',{session_id:s.id,exercise:e.name,set_no:nextSetNo(s,e.name),weight_kg:null,reps:0,note:'übersprungen'});
    const was=fxEx;await load();advanceIfDone(e);render();if(fxEx!==was)scrollTo(0,0)});
  trBusy=false}
async function finishExercise(exId){
  if(trBusy)return;trBusy=true;
  const e=S.ex.find(x=>x.id===exId);
  await run(async()=>{const s=await ensureSession(e.day_id),have=setRows(s,e.name).length,rows=[];
    let n=nextSetNo(s,e.name);for(let k=have;k<(e.sets||have);k++)rows.push({session_id:s.id,exercise:e.name,set_no:n++,weight_kg:null,reps:0,note:'übersprungen'});
    if(rows.length)await post('sets',rows);
    const l=S.ex.filter(x=>x.day_id===e.day_id),i=l.findIndex(x=>x.id===e.id);if(i>=0&&i<l.length-1)fxEx=i+1;
    await load();render();scrollTo(0,0)});
  trBusy=false}
async function fillTargets(exId){
  if(trBusy)return;
  const e=S.ex.find(x=>x.id===exId),sess0=S.sessions.find(x=>x.day===today()&&x.day_id===e.day_id);
  const last=lastFor(e.name,sess0&&sess0.id,e.day_id);if(!last)return;
  trBusy=true;
  await run(async()=>{
    const s=await ensureSession(e.day_id),have=setRows(s,e.name).length,total=e.sets||last.length,rows=[];let no=nextSetNo(s,e.name);
    for(let k=have;k<total;k++){const t=setTarget(e,last,k);rows.push({session_id:s.id,exercise:e.name,set_no:no++,weight_kg:t.w,reps:t.r})}
    if(rows.length)await post('sets',rows);
    const was=fxEx;await load();advanceIfDone(e);render();if(fxEx!==was)scrollTo(0,0)});
  trBusy=false}
async function delSet(id){await run(async()=>{await del('sets','id=eq.'+id);await load();render()})}
// ---------- Training erledigt: Auswertung statt Eingabe ----------
function finishedView(se,day){
  const sets=(se.sets||[]).slice().sort((a,b)=>a.set_no-b.set_no),vol=sets.reduce((a,x)=>a+x.weight_kg*x.reps,0);
  const prev=S.sessions.filter(x=>x.id!==se.id&&x.day_id===se.day_id&&x.day<=se.day&&x.id<se.id).sort((a,b)=>b.day.localeCompare(a.day)||b.id-a.id)[0]||null;
  const pvol=prev?(prev.sets||[]).reduce((a,x)=>a+x.weight_kg*x.reps,0):null;
  const before=S.sessions.filter(x=>x.id!==se.id&&(x.day<se.day||(x.day===se.day&&x.id<se.id))).flatMap(x=>x.sets||[]);
  const names=[...new Set(sets.map(x=>x.exercise))],prs=[];
  names.forEach(n=>{
    const cur=Math.max(...sets.filter(x=>x.exercise===n).map(x=>+x.weight_kg||0)),o=before.filter(x=>x.exercise===n).map(x=>+x.weight_kg||0);
    if(cur>0&&o.length&&cur>Math.max(...o))prs.push(n+' '+nf(cur)+' kg');
  });
  const mins=se.finished_at&&se.started_at?Math.max(1,Math.round((new Date(se.finished_at)-new Date(se.started_at))/60000)):null;
  const hhmm=t=>t?new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';
  const pct=pvol?Math.round((vol-pvol)/pvol*100):null;
  const cmp=(x,o)=>!o?'':(+x.weight_kg>+o.weight_kg||(+x.weight_kg===+o.weight_kg&&x.reps>o.reps))?'<span class="ok">▲</span>':(+x.weight_kg<+o.weight_kg||(+x.weight_kg===+o.weight_kg&&x.reps<o.reps))?'<span class="warn">▼</span>':'<span class="mut">＝</span>';
  const exCards=S.ex.filter(e=>e.day_id===se.day_id).map(e=>e.name);
  const order=[...new Set([...exCards.filter(n=>names.includes(n)),...names])];
  return `${insBox('training:'+se.id)}<button class="g s" style="width:100%;margin-bottom:10px" onclick="manualReview('training',${se.id})"><img class="e3" src="ic/ic-bolt-st.png" alt=""> Training von der KI auswerten lassen</button><div class="card" style="border-color:var(--ok)"><div class="row sp"><span style="display:flex;align-items:center;gap:10px">${lionSvg(46,'f')}<b style="font-size:22px">Training erledigt</b></span><span class="mut">${hhmm(se.started_at)}${se.finished_at?' – '+hhmm(se.finished_at):''}</span></div>
    <div class="mut" style="margin-top:4px">Tag ${day.day_no}: ${esc(day.name)}</div></div>
  <div class="card row sp"><div><div class="mut">Volumen</div><div class="big">${Math.round(vol)} kg</div></div><div><div class="mut">Sätze</div><div class="big">${sets.length}</div></div><div><div class="mut">Dauer</div><div class="big">${mins??'–'} min</div></div></div>
  <div class="card">${(se.allSets||[]).length>sets.length?`<span class="mut">${(se.allSets||[]).length-sets.length} Sätze übersprungen.</span><br>`:''}${pct!=null?`Gegenüber der letzten gleichen Einheit: <b class="${pct>=0?'ok':'warn'}">${pct>=0?'+':''}${pct} %</b> Volumen`:'Keine Vergleichseinheit.'}<br>
   ${prs.length?'':'<span class="mut">Keine neuen Bestwerte.</span>'}</div>${prs.map(x=>medalHtml('Neuer Bestwert',x)).join('')}
  <h2>So lief es</h2>
  ${order.map(n=>{const cur=sets.filter(x=>x.exercise===n),old=prev?(prev.sets||[]).filter(x=>x.exercise===n).sort((a,b)=>a.set_no-b.set_no):[],note=(S.notes||[]).find(x=>x.exercise===n);
    return `<div class="card"><b>${esc(n)}</b><table>${cur.map((x,i)=>`<tr><td class="mut" style="width:28px">${i+1}</td><td><b>${wt(x.weight_kg)}${(+x.weight_kg)>0?' kg':''} × ${x.reps}</b></td><td style="width:26px">${cmp(x,old[i])}</td><td class="mut" style="text-align:right">${old[i]?'zuvor '+wt(old[i].weight_kg)+' × '+old[i].reps:'neu'}</td></tr>`).join('')}</table>${note&&note.note?`<div class="mut" style="margin-top:6px">Notiz: ${esc(note.note)}</div>`:''}</div>`}).join('')}
  <button style="width:100%;margin-top:6px" onclick="tab='fortschritt';render();scrollTo(0,0)">Fortschritt ansehen</button>
  <button class="g s" style="width:100%;margin-top:10px" onclick="reopenSession(${se.id})">Training wieder öffnen</button>`;
}
async function reopenSession(id){
  if(!confirm('Training wieder öffnen? Dann kannst du Sätze ändern, und du musst es danach erneut beenden.'))return;
  await run(async()=>{await patch('sessions','id=eq.'+id,{finished_at:null});await load();render();scrollTo(0,0)});
}
async function finishSession(){
  const s=S.sessions.find(x=>x.day===today()&&x.day_id===selDay);
  if(!s||!(s.sets||[]).length){alert('Es ist noch kein Satz gespeichert.');return}
  const open=S.ex.filter(e=>e.day_id===selDay&&setRows(s,e.name).length<(e.sets||0)).map(e=>e.name);
  if(open.length&&!confirm('Noch offen: '+open.slice(0,5).join(', ')+(open.length>5?' …':'')+'. Training trotzdem beenden?'))return;
  rtStop();await run(async()=>{if(!s.finished_at)await patch('sessions','id=eq.'+s.id,{finished_at:new Date().toISOString()});await load();tab='training';render();scrollTo(0,0)})}
function showSummary(id){
  const s=S.sessions.find(x=>x.id===id);if(!s)return;
  const sets=s.sets||[],vol=sets.reduce((a,x)=>a+x.weight_kg*x.reps,0);
  const prev=S.sessions.find(x=>x.id!==id&&x.day_id===s.day_id&&x.day<=s.day&&x.id<id);
  const pvol=prev?(prev.sets||[]).reduce((a,x)=>a+x.weight_kg*x.reps,0):null;
  const others=S.sessions.filter(x=>x.id!==id&&x.day<=s.day).flatMap(x=>x.sets||[]);
  const names=[...new Set(sets.map(x=>x.exercise))],prs=[];
  names.forEach(n=>{
    const cur=Math.max(...sets.filter(x=>x.exercise===n).map(x=>e1rm(x.weight_kg,x.reps)));
    const o=others.filter(x=>x.exercise===n).map(x=>e1rm(x.weight_kg,x.reps));
    if(o.length&&cur>Math.max(...o))prs.push(n+' ('+fmt(cur,1)+' kg 1RM)');
  });
  const mins=s.finished_at?Math.round((new Date(s.finished_at)-new Date(s.started_at))/60000):null;
  openModal(`<h1>Training fertig</h1>
  <div class="card row sp"><div><div class="mut">Volumen</div><div class="big">${Math.round(vol)} kg</div></div><div><div class="mut">Sätze</div><div class="big">${sets.length}</div></div><div><div class="mut">Dauer</div><div class="big">${mins??'–'} min</div></div></div>
  <div class="card">${pvol!=null?`Gegenüber letzter Einheit: <b class="${vol>=pvol?'ok':'warn'}">${vol>=pvol?'+':''}${Math.round((vol-pvol)/pvol*100)}%</b> Volumen`:'Keine Vergleichseinheit.'}<br>
  ${prs.length?'<b class="ok">Neue PRs:</b> '+prs.map(esc).join(', '):'<span class="mut">Keine neuen PRs.</span>'}</div>
  <details><summary>Details pro Übung</summary>${names.map(n=>{
    const cur=sets.filter(x=>x.exercise===n).sort((a,b)=>a.set_no-b.set_no),old=prev?(prev.sets||[]).filter(x=>x.exercise===n).sort((a,b)=>a.set_no-b.set_no):[];
    return `<div class="card"><b>${esc(n)}</b><table>${cur.map((x,i)=>`<tr><td>${i+1}</td><td>${fmt(x.weight_kg,1)} × ${x.reps}</td><td class="mut">${old[i]?fmt(old[i].weight_kg,1)+' × '+old[i].reps:'–'}</td></tr>`).join('')}</table></div>`}).join('')}</details>
  <br><button onclick="closeModal();tab='fortschritt';render()">Fortschritt ansehen</button> <button class="g" onclick="closeModal()">Schließen</button>`);
}

const effTime=(no,t)=>{const o=S.mo.find(x=>x.meal_no===no);return o?o.time_of_day:t};
function mealGroups(){
  const g={};S.meals.forEach(m=>{(g[m.meal_no]??=[]).push(m)});
  return Object.entries(g).sort((a,b)=>(hm(effTime(+a[0],a[1][0].time_of_day))||'99').localeCompare(hm(effTime(+b[0],b[1][0].time_of_day))||'99'));
}

function mealCards(compact){
  const gs=mealGroups();if(!gs.length)return '<div class="card mut">Noch kein Mahlzeitenplan. Unter „Essen“ anlegen.</div>';
  return gs.map(([no,items])=>{

    const eatenNow=S.flog.some(l=>l.meal_name===items[0].name);
    return `<div class="card"><div class="row sp"><div><b>${esc(items[0].name)}</b> <span class="pill">${hm(effTime(+no,items[0].time_of_day))||'–'}</span>${rep?' <span class="pill warn">auswärts</span>':''}${S.mo.some(o=>o.meal_no===+no)?' <span class="pill warn">heute verschoben</span>':''}
    <div class="mut">${Math.round(k.k)} kcal · P${Math.round(k.p)} C${Math.round(k.c)} F${Math.round(k.f)}</div></div>
    <span style="white-space:nowrap">${items[0].recipe?`<button class="g s" onclick="showRecipe('${items[0].recipe}')">Rezept</button> `:''}${eatenNow?`<button class="g s" onclick="mealMenu(${no})">✓ ${esc(stateBtn(mealState(items[0].name)))} ⋯</button>`:`<button class="s" onclick="eatMeal(${no})">Gegessen</button> <button class="g s" onclick="mealMenu(${no})">⋯</button>`}</span></div>
    ${compact?`<div class="row" style="margin-top:8px"><span class="mut">Heute um</span><input id="tc${no}" type="time" style="width:130px" value="${hm(effTime(+no,items[0].time_of_day))}"><button class="s" onclick="setMealToday(${no},document.getElementById('tc${no}').value)">OK</button>${S.mo.some(o=>o.meal_no===+no)?`<button class="g s" onclick="resetMealToday(${no})">zurücksetzen</button>`:''}</div>`:items.map(m=>`<div class="row sp mut" style="margin-top:6px"><span>${esc((m.foods?.name||'').replace(/\s*\(.*\)/,''))} · ${adjGrams(m)!==m.grams?m.grams+' → '+amtLabel(m):amtLabel(m)}</span>${MEDIT.has(+no)?`<button class="g s" onclick="delMealItem(${m.id})">✕</button>`:''}</div>`).join('')+
    `<div class="row" style="margin-top:8px"><button class="g s" onclick="toggleMealEdit(${+no})">${MEDIT.has(+no)?'Fertig':'✎ Bearbeiten'}</button></div>`+(!MEDIT.has(+no)?'':`<div class="row" style="margin-top:8px"><span class="mut">Art</span><select onchange="setMealMode(${no},this.value)">${Object.entries(MODES).map(([k,l])=>`<option value="${k}" ${mealMode(items)===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:8px"><input type="time" value="${hm(items[0].time_of_day)}" onchange="setMealTime(${no},this.value)"><button class="g s" onclick="delMeal(${no})">Mahlzeit löschen</button></div>
    <div class="row" style="margin-top:8px"><select id="mf${no}">${S.foods.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select><input id="mg${no}" type="number" placeholder="g" style="width:90px"><button class="s" onclick="addMealItem(${no})">+</button></div>`)}</div>`}).join('');
}
let TMO=false;
function tomorrowTimes(){
  const tm=addDays(today(),1),g={};S.meals.forEach(m=>{(g[m.meal_no]??=[]).push(m)});
  const rows=Object.entries(g).map(([no,it])=>{const o=(S.mo2||[]).find(x=>x.meal_no===+no),t=hm(o?o.time_of_day:it[0].time_of_day);return{no:+no,name:it[0].name,t,set:!!o}}).sort((a,b)=>(a.t||'99').localeCompare(b.t||'99'));
  if(!rows.length)return '';
  return `<details class="card" style="margin-top:14px"${TMO?' open':''} ontoggle="TMO=this.open"><summary><b>Essenszeiten für morgen</b> <span class="mut">${deDate(tm)}</span></summary><div class="mut" style="margin:8px 0 4px;font-size:13px">Nur für morgen. Die Reihenfolge ergibt sich aus den Uhrzeiten.</div>${rows.map(r=>`<div class="row sp" style="margin-top:8px"><span>${esc(r.name)}${r.set?' <span class="pill warn">geändert</span>':''}</span><span class="row" style="gap:6px"><input id="tm${r.no}" type="time" style="width:120px;min-height:40px;padding:6px 10px" value="${r.t||''}"><button class="s" onclick="setMealTomorrow(${r.no},document.getElementById('tm${r.no}').value)">OK</button>${r.set?`<button class="g s" onclick="resetMealTomorrow(${r.no})">↺</button>`:''}</span></div>`).join('')}</details>`;
}
async function setMealTomorrow(no,v){if(!v)return;await run(async()=>{await post('meal_overrides?on_conflict=device_key,day,meal_no',{day:addDays(today(),1),meal_no:no,time_of_day:v},{Prefer:'resolution=merge-duplicates,return=representation'});await load();render()})}
async function resetMealTomorrow(no){await run(async()=>{await del('meal_overrides','day=eq.'+addDays(today(),1)+'&meal_no=eq.'+no);await load();render()})}
async function setMealToday(no,v){if(!v)return;await run(async()=>{await post('meal_overrides?on_conflict=device_key,day,meal_no',{day:today(),meal_no:no,time_of_day:v},{Prefer:'resolution=merge-duplicates,return=representation'});await load();render()})}
async function resetMealToday(no){await run(async()=>{await del('meal_overrides','day=eq.'+today()+'&meal_no=eq.'+no);await load();render()})}
async function eatMeal(no){
  const items=S.meals.filter(m=>m.meal_no===no),rep=replacedOf(no),mode=mealMode(items);
  if(!rep&&mode==='box'){await eatBox(no);return}
  if(!rep&&mode==='plate'){await eatPlate(no,true);return}
  await run(async()=>{
    if(rep){
      await post('food_log',{meal_name:items[0].name,grams:null,kcal:rep.kcal,protein:rep.p,carbs:rep.c,fat:rep.f,day:today()});
    }else{
      await post('food_log',items.map(m=>{const f=m.foods,g=adjGrams(m),x=g/(f.per_g||100);
        return{food_id:f.id,meal_name:m.name,grams:g,kcal:f.kcal*x,protein:f.protein*x,carbs:f.carbs*x,fat:f.fat*x,day:today()}}));
    }
    await load();render();
  });
}

    await del('food_log','day=eq.'+today()+'&meal_name=eq.'+encodeURIComponent(it.name));

async function doReplace(no){
  const it=S.meals.find(m=>m.meal_no===no),label=document.getElementById('rpl').value.trim(),x=readMacros('rp');
  if(!label||!(x.k>0)){alert('Bitte Bezeichnung und Kcal eintragen (oder von der KI schätzen lassen).');return}
  closeModal();
  await run(async()=>{
    await del('food_log','day=eq.'+today()+'&meal_name=eq.'+encodeURIComponent(it.name));
    await post('food_log',{meal_name:it.name,grams:null,kcal:x.k,protein:x.p,carbs:x.c,fat:x.f,day:today(),source:{replaced:label}});
    await load();render()});

async function ceSave(){
  const no=CE.no,items=S.meals.filter(m=>m.meal_no===no),nm=items[0].name,mode=mealMode(items),rows=[],used={};

    const f=m.foods,fac=factorOf(m.food_id),inp=document.getElementById('pg'+m.id),g=inp?(num(inp.value)||0):0;
    if(g<=0)continue;
    const x=perFood(f,g/fac),take=[];let left=g;
    if(mode==='plate')for(const bb of (S.batches||[]).filter(y=>y.food_id===m.food_id&&+y.remaining_g>0).sort((a,c)=>a.id-c.id)){if(left<=0)break;const t=Math.min(left,+bb.remaining_g-(used[bb.id]||0));if(t>0){take.push({id:bb.id,g:Math.round(t*10)/10});used[bb.id]=(used[bb.id]||0)+t;left-=t}}

function chart(){
  const pts=[...S.bw].filter(b=>(new Date(today())-new Date(b.day))/864e5<=42).reverse();
  if(pts.length<2)return '<div class="mut">Mindestens zwei Einträge nötig.</div>';
  const vs=pts.map(p=>+p.kg),mn=Math.min(...vs)-0.3,mx=Math.max(...vs)+0.3,W=300,H=110;
  const x=i=>i/(pts.length-1)*W,y=v=>H-(v-mn)/(mx-mn)*H;
  const line=vs.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const ma=vs.map((_,i)=>{const w=vs.slice(Math.max(0,i-6),i+1);return w.reduce((a,b)=>a+b,0)/w.length});
  const mline=ma.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%"><path d="${line}" fill="none" stroke="#555" stroke-width="1.5"/><path d="${mline}" fill="none" stroke="#6372ff" stroke-width="2.5"/></svg>
  <div class="mut">${fmt(Math.min(...vs))} – ${fmt(Math.max(...vs))} kg · rot = 7-Tage-Schnitt</div>`;
}

const MEDCOPY=['name','kind','dose','site','weekdays','time_of_day','active','note','plan_days','interval_days','anchor_day','day_type','time_ref','time_off','dose_mg','dose_unit','conc_mg_ml','weekly_mg'];

// ---------- Wochenplanung einer Spritze (Gesamtdosis pro Woche, Verteilung auf Plantage/Wochentage) ----------
const nf=x=>x==null||isNaN(x)?'':String(Math.round(x*100)/100).replace('.',',');
function medAmount(m){
  if(m.dose_mg!=null)return{mg:+m.dose_mg,unit:m.dose_unit||'mg',ml:m.conc_mg_ml?+m.dose_mg/+m.conc_mg_ml:null};
  const d=String(m.dose||'').replace(',','.'),a=d.match(/(\d+(?:\.\d+)?)\s*(mg|iu|µg|mcg)/i),l=d.match(/(\d+(?:\.\d+)?)\s*ml/i);
  let u='mg';if(a){if(/^iu$/i.test(a[2]))u='IU';else if(/^(µg|mcg)$/i.test(a[2]))u='µg'}
  return{mg:a?+a[1]:null,unit:u,ml:l?+l[1]:null};
}
const trainCount=()=>{const n=(S.days||[]).filter(d=>!d.is_rest).length;return n||6};
const occOf=m=>m.day_type==='train'?trainCount():m.day_type==='rest'?Math.max(1,7-trainCount()):m.interval_days?7/m.interval_days:(m.plan_days&&m.plan_days.length?m.plan_days.length:((m.weekdays||[]).length||0));
const dayOrd=m=>m.day_type?60:m.interval_days?40+m.interval_days:(m.plan_days&&m.plan_days.length?Math.min(...m.plan_days):20+((m.weekdays||[1])[0]||1));
function weeklySum(rows){let t=0,any=false;rows.forEach(m=>{const a=medAmount(m);if(a.mg!=null){t+=a.mg*occOf(m);any=true}});return any?t:null}
let PL=null;
function plOcc(r){return r.d==='all'?7:r.d==='i'?7/(r.n||1):r.d==='train'?trainCount():r.d==='rest'?Math.max(1,7-trainCount()):1}
function openPlanner(cy,name){
  const rows=name?S.meds.filter(m=>(m.cycle_id||null)===(cy||null)&&m.kind==='injektion'&&m.name===name):[];
  const first=rows[0]||{},a0=rows.length?medAmount(first):{unit:'mg'};
  let conc=first.conc_mg_ml!=null?+first.conc_mg_ml:null;
  if(conc==null&&rows.length){const a=medAmount(first);if(a.mg&&a.ml)conc=Math.round(a.mg/a.ml*100)/100}
  const prs=[];
  rows.slice().sort((x,y)=>dayOrd(x)-dayOrd(y)).forEach(m=>{
    const a=medAmount(m);let days;
    if(m.day_type){prs.push({id:m.id,d:m.day_type,mg:a.mg,site:m.site||''});return}
    if(m.interval_days){prs.push({id:m.id,d:'i',n:m.interval_days,start:m.anchor_day||today(),mg:a.mg,site:m.site||''});return}
    if(m.plan_days&&m.plan_days.length)days=m.plan_days.map(n=>'p'+n);
    else if((m.weekdays||[]).length===7)days=['all'];
    else days=(m.weekdays||[1]).map(n=>'w'+n);
    days.forEach((d,i)=>prs.push({id:i===0?m.id:null,d,mg:a.mg,site:m.site||''}))});
  const sm=weeklySum(rows);
  PL={cy:cy==null?null:cy,oldName:name||null,name:name||'',unit:a0.unit||'mg',conc,weekly:first.weekly_mg!=null?+first.weekly_mg:sm,time:first.time_of_day?hm(first.time_of_day):'20:50',timeRef:first.time_ref||'',timeOff:first.time_off||0,
    rows:prs.length?prs:[{id:null,d:'w1',mg:null,site:''}],orig:rows.map(m=>m.id)};
  planRender();
}
const WDL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
function plDayOpts(sel){return `${sel&&sel[0]==='p'?`<optgroup label="Alter Plantag">${[1,2,3,4,5,6,7].map(n=>`<option value="p${n}" ${sel==='p'+n?'selected':''}>Tag ${n}</option>`).join('')}</optgroup>`:''}

function planRender(){
  openModal(`<h1>${PL.oldName?esc(PL.oldName):'Neue Spritze'}</h1>

   <div style="max-width:130px"><div class="mut">Uhrzeit</div><input type="time" value="${PL.time||''}" oninput="PL.time=this.value" ${PL.timeRef?'disabled':''}></div></div>
  <div class="row" style="margin-top:8px;align-items:flex-end"><div><div class="mut">Zeitpunkt</div><select onchange="PL.timeRef=this.value;planRender()"><option value="" ${PL.timeRef?'':'selected'}>Feste Uhrzeit</option><option value="pre" ${PL.timeRef==='pre'?'selected':''}>Beim Pre-Workout</option><option value="train" ${PL.timeRef==='train'?'selected':''}>Beim Training</option><option value="post" ${PL.timeRef==='post'?'selected':''}>Beim Post-Workout</option></select></div>

  <div class="mut" style="margin:16px 0 6px">Verteilung auf die Woche</div>
  ${PL.rows.map((r,i)=>`<div class="card" style="padding:8px;margin-bottom:6px"><div class="row"><select onchange="plRow(${i},'d',this.value)" style="flex:1.2">${plDayOpts(r.d)}</select>
   <input type="text" inputmode="decimal" placeholder="Menge" value="${nf(r.mg)}" oninput="plRow(${i},'mg',this.value)" style="flex:1"><span id="pl_ml${i}" class="mut" style="min-width:56px;text-align:right"></span></div>
   ${r.d==='i'?`<div class="row" style="margin-top:6px;align-items:flex-end"><div style="max-width:90px"><div class="mut">Alle … Tage</div><input type="number" inputmode="numeric" min="1" max="60" value="${r.n||2}" oninput="plRow(${i},'n',this.value)"></div><div><div class="mut">Erste Gabe am</div><input type="date" value="${r.start||''}" oninput="plRow(${i},'start',this.value)"></div></div>`:''}
   <div class="row" style="margin-top:6px"><input placeholder="Stelle (optional)" value="${esc(r.site||'')}" oninput="plRow(${i},'site',this.value)"><button class="g s" onclick="plDel(${i})">✕</button></div></div>`).join('')}
  <div class="row"><button class="g s" style="flex:1" onclick="plAdd()">+ Tag</button><button class="g s" style="flex:1" onclick="plSpread()">Gleichmäßig verteilen</button></div>
  <div id="pl_sum" class="card" style="margin-top:10px;padding:10px"></div>
  <button onclick="savePlanner()" style="width:100%">Speichern</button>
  ${PL.orig.length?`<button class="g" style="width:100%;margin-top:10px" onclick="delPlanner()">Substanz aus diesem Zyklus löschen</button>`:''}`);
  plSum();
}
function plSet(k,v){const n=num(v);PL[k]=isNaN(n)||n<=0?null:n;plSum()}
function plRow(i,f,v){const r=PL.rows[i];if(!r)return;if(f==='mg'){const n=num(v);r.mg=isNaN(n)||n<=0?null:n}else if(f==='n'){const n=parseInt(v);r.n=isNaN(n)||n<1?1:Math.min(60,n)}else r[f]=v;
  if(f==='d'){if(v==='i'){r.n=r.n||2;r.start=r.start||today()}planRender();return}plSum()}
function plDel(i){PL.rows.splice(i,1);if(!PL.rows.length)PL.rows.push({id:null,d:'w1',mg:null,site:''});planRender()}
function plAdd(){const used=new Set(PL.rows.map(r=>r.d));let d='w1';for(let n=1;n<=7;n++)if(!used.has('w'+n)){d='w'+n;break}
  PL.rows.push({id:null,d,mg:null,site:(PL.rows.at(-1)||{}).site||''});planRender()}
function plSpread(){const occ=PL.rows.reduce((a,r)=>a+plOcc(r),0);if(!PL.weekly||!occ){alert('Erst die Gesamtdosis pro Woche eintragen');return}
  const per=Math.round(PL.weekly/occ*100)/100;PL.rows.forEach(r=>r.mg=per);planRender()}
function plSum(){
  const sum=PL.rows.reduce((a,r)=>a+(r.mg||0)*plOcc(r),0);
  PL.rows.forEach((r,i)=>{const el=document.getElementById('pl_ml'+i);if(el)el.textContent=PL.conc&&r.mg?nf(r.mg/PL.conc)+' ml':''});
  const el=document.getElementById('pl_sum');if(!el)return;
  const diff=PL.weekly?Math.round((PL.weekly-sum)*100)/100:null;
  el.innerHTML=`<div class="row sp"><span>Verteilt</span><b>${nf(sum)} ${PL.unit}</b></div>`+(PL.weekly?`<div class="row sp"><span>Ziel pro Woche</span><b>${nf(PL.weekly)} ${PL.unit}</b></div>
    <div class="${diff===0?'ok':'warn'}" style="margin-top:4px">${diff===0?'✓ passt genau':diff>0?'noch '+nf(diff)+' '+PL.unit+' offen':nf(-diff)+' '+PL.unit+' zu viel'}</div>`:'<div class="mut">Ohne Wochenziel zählt nur die Summe.</div>')+
    (PL.conc&&sum?`<div class="mut" style="margin-top:4px">Insgesamt ${nf(sum/PL.conc)} ml pro Woche</div>`:'');
}
async function savePlanner(){
  const name=(PL.name||'').trim();if(!name){alert('Bitte eine Substanz eintragen');return}
  const rows=PL.rows.filter(r=>r.mg>0);if(!rows.length){alert('Bitte mindestens eine Menge eintragen');return}
  const sum=Math.round(rows.reduce((a,r)=>a+r.mg*plOcc(r),0)*100)/100,weekly=PL.weekly||sum,keep=new Set(rows.map(r=>r.id).filter(Boolean)),gone=PL.orig.filter(id=>!keep.has(id));
  if(gone.length&&!confirm(gone.length+' Eintrag/Einträge fallen weg. Ihr Einnahme-Verlauf wird mit gelöscht. Weiter?'))return;
  const mk=r=>{const ml=PL.conc?r.mg/PL.conc:null;

// ---------- Bedarfs- und Kostenrechner ----------
const normS=x=>String(x||'').toLowerCase().replace(/[^a-z0-9äöüß]+/g,'');
const eur=x=>x==null||isNaN(x)?'–':(Math.round(x*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const dlong=d=>d?new Date(d+'T00:00:00').toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}):'';
let CALC={cy:null,base:true,weeks:null,unit:{}};
function pcsOf(m){const x=String(m.dose||'').match(/(\d+)\s*(stück|st\.|kapseln|tabletten|tabs)/i);return x?+x[1]:1}
const ppu=p=>p.kind==='injektion'?(p.price_eur&&p.pack_ml&&p.conc_mg_ml?p.price_eur/(p.pack_ml*p.conc_mg_ml):1e9):(p.price_eur&&p.pack_units?p.price_eur/p.pack_units:1e9);
function calcData(){
  const cs=S.cycles||[];
  if(CALC.cy==null)CALC.cy=(cs.find(c=>c.active)||cs[0]||{}).id??null;
  const c=cs.find(x=>x.id===CALC.cy)||null,T=today();
  const start=c&&c.start_day&&c.start_day>T?c.start_day:T;
  let end;if(CALC.weeks)end=addDays(start,CALC.weeks*7-1);else if(c&&c.end_day)end=c.end_day;else end=addDays(start,12*7-1);
  const days=Math.max(0,daysBetween(start,end)+1),stock={};(S.stock||[]).forEach(r=>stock[normS(r.substance)]=r);
  const meds=S.meds.filter(m=>m.active&&((c&&m.cycle_id===c.id)||(CALC.base&&!m.cycle_id)));
  const subs={};
  meds.forEach(m=>{const k=normS(m.name);(subs[k]??={key:k,name:m.name,kind:m.kind==='injektion'?'injektion':'tablette',meds:[]}).meds.push(m)});
  Object.values(subs).forEach(sb=>{
    sb.prods=(S.products||[]).filter(x=>normS(x.substance)===sb.key).sort((a,b)=>ppu(a)-ppu(b));
    const pid=CALC.prod&&CALC.prod[sb.key];sb.prod=sb.prods.find(x=>x.id===pid)||sb.prods[0]||null;
    const cm=sb.meds.find(m=>m.conc_mg_ml!=null);sb.conc=cm?+cm.conc_mg_ml:(sb.prod&&sb.prod.conc_mg_ml?+sb.prod.conc_mg_ml:null);
    const st=stock[sb.key];sb.stock=st||null;
    const inj=sb.kind==='injektion';
    sb.unit=inj?medAmount(sb.meds[0]).unit:'Stk';
    sb.have=inj?((st&&st.have_ml!=null&&sb.conc)?+st.have_ml*sb.conc:0):((st&&+st.have_units)||0);
    let cum=0;sb.run=null;sb.missingDose=false;
    for(let i=0;i<days;i++){const d=addDays(start,i);
      sb.meds.forEach(m=>{if(!medDueOn({...m,cycle_id:null},d))return;const amt=inj?medAmount(m).mg:pcsOf(m);if(amt==null||isNaN(amt)){sb.missingDose=true;return}cum+=amt});
      if(sb.run==null&&cum>sb.have+1e-9)sb.run=d}
    sb.need=cum;sb.missing=Math.max(0,cum-sb.have);
    const pr=sb.prod;
    if(inj){sb.needMl=sb.conc?cum/sb.conc:null;sb.missMl=sb.conc?sb.missing/sb.conc:null;
      sb.buy=pr&&pr.pack_ml&&sb.missMl!=null?Math.ceil(sb.missMl/pr.pack_ml-1e-9):null;sb.cost=sb.buy!=null&&pr.price_eur!=null?sb.buy*pr.price_eur:null;
      sb.leftover=sb.buy!=null?sb.buy*pr.pack_ml-sb.missMl:null}
    else{sb.buy=pr&&pr.pack_units?Math.ceil(sb.missing/pr.pack_units-1e-9):null;sb.cost=sb.buy!=null&&pr.price_eur!=null?sb.buy*pr.price_eur:null;sb.leftover=sb.buy!=null?sb.buy*pr.pack_units-sb.missing:null}
    const avg=days?cum/days:0;sb.extraDays=sb.run==null&&avg>0?Math.floor((sb.have-cum)/avg):null;
  });
  const list=Object.values(subs).sort((a,b)=>(a.kind===b.kind?0:a.kind==='injektion'?-1:1)||a.name.localeCompare(b.name));
  return{c,start,end,days,list,total:list.reduce((a,x)=>a+(x.cost||0),0),unpriced:list.filter(x=>x.missing>0&&x.cost==null).length};
}
function stockShown(sb){
  const st=sb.stock,u=CALC.unit[sb.key]||(sb.kind==='injektion'?'ml':'Stk'),mgU=u!=='ml'&&u!=='Fl.';
  if(!st)return{u,v:''};
  if(sb.kind==='injektion'){const ml=st.have_ml!=null?+st.have_ml:null;if(ml==null)return{u,v:''};
    return{u,v:u==='ml'?nf(ml):mgU?nf(sb.conc?ml*sb.conc:null):nf(sb.prod&&sb.prod.pack_ml?ml/sb.prod.pack_ml:null)}}
  const n=st.have_units!=null?+st.have_units:null;return{u,v:n==null?'':u==='Pck'?nf(sb.prod&&sb.prod.pack_units?n/sb.prod.pack_units:null):nf(n)}}
async function calcStock(key,name,val,unit){
  const sb=calcData().list.find(x=>x.key===key);if(!sb)return;
  const n=num(val),inj=sb.kind==='injektion';CALC.unit[key]=unit;
  let row={substance:name};
  if(val===''||isNaN(n))row=inj?{...row,have_ml:null}:{...row,have_units:null};
  else if(inj){const ml=unit==='ml'?n:(unit!=='Fl.')?(sb.conc?n/sb.conc:NaN):(sb.prod&&sb.prod.pack_ml?n*sb.prod.pack_ml:NaN);
    if(isNaN(ml)){alert(unit!=='Fl.'&&unit!=='ml'?'Für mg braucht die Substanz eine Konzentration (mg pro ml).':'Für Fläschchen braucht das Produkt eine Größe in ml (Preisliste).');render();return}row.have_ml=ml}
  else{const u=unit==='Pck'?(sb.prod&&sb.prod.pack_units?n*sb.prod.pack_units:NaN):n;if(isNaN(u)){alert('Für Packungen braucht das Produkt eine Stückzahl pro Packung (Preisliste).');render();return}row.have_units=u}
  await run(async()=>{const ex=(S.stock||[]).find(r=>normS(r.substance)===key);
    if(ex)await patch('substance_stock','id=eq.'+ex.id,{...row,updated_at:new Date().toISOString()});else await post('substance_stock',row);
    await load();render()})}

  const tot=`<div class="card" style="border-color:var(--ac)"><div class="mut">Noch zu kaufen</div><div class="big">${eur(D.total)}</div>
   <div class="mut">${D.list.filter(x=>x.buy>0).map(x=>x.buy+' × '+esc(x.prod.label||x.name)).join(' · ')||'Nichts, dein Bestand reicht.'}${D.unpriced?`<br><span class="warn">${D.unpriced} Substanz(en) ohne Preis, nicht eingerechnet</span>`:''}</div></div>`;
  const cards=D.list.map(sb=>{

    const buyTxt=sb.missing<=0?'<span class="ok">Nichts nötig</span>':sb.buy==null?(pr?'<span class="warn">Größe oder Konzentration fehlt</span>':'<span class="warn">Kein Produkt in der Preisliste</span>'):`<b>${sb.buy} × ${esc(pr.label||sb.name)}</b>${sb.cost!=null?' = <b>'+eur(sb.cost)+'</b>':' <span class="warn">(Preis fehlt)</span>'}`;
    const reach=sb.need<=0?'':sb.run==null?`<span class="ok">reicht bis Zyklusende</span>${sb.extraDays>0?' · +'+sb.extraDays+' Tage Reserve':''}`:(sb.run===D.start?`<span class="warn">${sb.stock?'Bestand leer':'Kein Bestand eingetragen'}</span>`:`<span class="warn">reicht bis ${dlong(addDays(sb.run,-1))}</span> (noch ${daysBetween(D.start,sb.run)} Tage)`);
    return `<div class="card"><div class="row sp"><b style="font-size:18px">${esc(sb.name)}</b><span class="mut">${inj?'Spritze':'Tablette'}${sb.conc?' · '+nf(sb.conc)+' '+sb.unit+'/ml':''}</span></div>

    <div class="row" style="margin-top:8px;align-items:flex-end"><div><div class="mut">Bestand</div><input type="text" inputmode="decimal" placeholder="0" value="${sh.v}" onchange="calcStock('${sb.key}','${esc(sb.name).replace(/'/g,"\\'")}',this.value,document.getElementById('cu_${sb.key}').value)"></div>
     <div style="max-width:90px"><select id="cu_${sb.key}" onchange="CALC.unit['${sb.key}']=this.value;render()">${units.map(u=>`<option ${sh.u===u?'selected':''}>${u}</option>`).join('')}</select></div></div>

const pctD=(a,b)=>a!=null&&b?Math.round((a-b)/b*100):null;

function weekStats(w,i){
  const wd=[...Array(7)].map((_,k)=>addDays(today(),-(6+7*i)+k)),set=new Set(wd),T=targets();
  const by={};w.fl.filter(x=>set.has(x.day)).forEach(x=>{const b=by[x.day]??={k:0,p:0,c:0,f:0};b.k+=+x.kcal;b.p+=+x.protein;b.c+=+x.carbs;b.f+=+x.fat});

  const weight=mean(S.bw.filter(b=>set.has(b.day)).map(b=>+b.kg));

  const dm=w.dm.filter(x=>set.has(x.day));

}
function prsAndStall(){
  const since=addDays(today(),-6),byEx={};
  S.sessions.slice().sort((a,b)=>a.day.localeCompare(b.day)).forEach(se=>{
    const best={};(se.sets||[]).forEach(x=>{if(!(x.reps>0&&x.reps<=12))return;const e=e1rm(x.weight_kg,x.reps),k=exKey(x.exercise,se.day_id);if(best[k]==null||e>best[k])best[k]=e});
    Object.entries(best).forEach(([n,e])=>(byEx[n]??=[]).push({day:se.day,e}));
  });
  const prs=[],stall=[];
  Object.entries(byEx).forEach(([n,arr])=>{
    const before=arr.filter(a=>a.day<since).map(a=>a.e),cur=arr.filter(a=>a.day>=since).map(a=>a.e);
    if(cur.length&&before.length&&Math.max(...cur)>Math.max(...before))prs.push({n,e:Math.max(...cur),from:Math.max(...before)});
    if(arr.length>=3){const l=arr.slice(-3).map(a=>a.e);if(l[2]<=l[0]&&l[1]<=l[0])stall.push({n,last:l[2]})}
  });
  return{prs,stall};
}
function proposals(){
  const W=CI.W,w0=W[0],w1=W[1],out=[],goal=S.set.water_goal_ml||4000,T=targets();
  const painTop=Object.entries(w0.rec.pain).filter(([,n])=>n>=3).map(([q])=>q);
  if((w0.rec.energy!=null&&w0.rec.energy<=2.5)||(w0.rec.sleep!=null&&w0.rec.sleep<=2.5)||(w0.rec.stress!=null&&w0.rec.stress>=4)||painTop.length)
    out.push('Erholung: nächste Woche Volumen senken (je Übung ein Satz weniger), Energie, Schlaf, Stress oder Schmerzen sind auffällig.');
  painTop.forEach(q=>out.push('Schmerz „'+q+'“ an mindestens 3 Tagen: Übungen mit dieser Stelle prüfen, Gewicht senken oder ersetzen.'));
  if(w0.sleepH!=null&&w0.sleepH<6.5)out.push('Schlaf im Schnitt '+fmt(w0.sleepH,1)+' h: Koffein nach 14 Uhr streichen, Ziel 7 h.');
  if(w0.caff>400)out.push('Koffein im Schnitt '+Math.round(w0.caff)+' mg: ein Monster weniger am Tag.');
  if(w0.water!=null&&w0.water<goal*0.85)out.push('Wasser im Schnitt '+fmt(w0.water/1000,1)+' L: Ziel '+fmt(goal/1000,1)+' L.');
  if(w0.nutr.days>0&&w0.nutr.pOk<w0.nutr.days)out.push('Protein an '+(w0.nutr.days-w0.nutr.pOk)+' von '+w0.nutr.days+' Tagen unter 90 %: Mahlzeit mit Proteinmilch ergänzen.');
  if(w0.meds.exp&&w0.meds.got/w0.meds.exp<0.9)out.push('Meds nur zu '+Math.round(w0.meds.got/w0.meds.exp*100)+' % abgehakt.');
  if(w0.rec.hunger!=null&&w0.rec.hunger>=4)out.push('Hunger hoch: Gemüse (TK-Mix) und Zero-Ketchup erhöhen, Carbs besser auf Mahlzeit 1 und 4 verteilen.');
  CI.ps.stall.forEach(x=>out.push('Stillstand bei '+x.n+' (3 Einheiten ohne Steigerung): Satz- oder Wiederholungsbereich ändern, Pausen prüfen.'));
  return out;
}

function shrink(file,max,q){
  return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};
    img.onerror=rej;img.src=u});
}

  if(!food)return{cook:false,f:1,est:false};
  const lb=(S.batches||[]).filter(b=>b.food_id===food.id&&+b.raw_g>0).sort((a,b)=>b.id-a.id)[0];
  if(lb){const f=lb.cooked_g/lb.raw_g;return Math.abs(f-1)>0.03?{cook:true,f,est:false}:{cook:false,f:1,est:false}}
  if(/zubereitet|fertig/i.test(food.name))return{cook:false,f:1,est:false,ready:true};
  const d=COOKDEF.find(x=>x.re.test(food.name));return d?{cook:true,f:d.f,est:true}:{cook:false,f:1,est:false};
}

async function eatPlate(no,quick){
  const items=S.meals.filter(m=>m.meal_no===no);
  const rows=[],used={};
  for(const m of items){
    const f=m.foods,fac=factorOf(m.food_id),inp=document.getElementById('pg'+m.id);
    const g=quick||!inp?Math.round(adjGrams(m)*fac):(parseFloat(inp.value)||0);
    if(g<=0)continue;
    const raw=g/fac,x=perFood(f,raw),b=batchOf(m.food_id);
    const take=[];let left=g;
    for(const bb of (S.batches||[]).filter(x=>x.food_id===m.food_id&&+x.remaining_g>0).sort((a,c)=>a.id-c.id)){if(left<=0)break;const t=Math.min(left,+bb.remaining_g-(used[bb.id]||0));if(t>0){take.push({id:bb.id,g:Math.round(t*10)/10});used[bb.id]=(used[bb.id]||0)+t;left-=t}}
    rows.push({food_id:f.id,meal_name:m.name,grams:g,kcal:x.k,protein:x.p,carbs:x.c,fat:x.f,day:today(),source:take.length?{batches:take}:null});
  }
  closeModal();
  await run(async()=>{
    if(rows.length)await post('food_log',rows);
    for(const [id,g] of Object.entries(used)){const b=S.batches.find(x=>x.id===+id);await patch('prep_batches','id=eq.'+id,{remaining_g:Math.max(0,Math.round((+b.remaining_g-g)*10)/10)})}

  });
}

function stockInfo(){
  const out=[],T=today(),gs=mealGroups(),plate=gs.filter(([no,it])=>mealMode(it)==='plate'&&!replacedOf(+no));
  const everPrepped=new Set((S.batches||[]).map(b=>b.food_id)),perDay={},nextNeed={};
  plate.forEach(([no,it])=>it.forEach(m=>{const c=cookInfo(m.foods);if(!everPrepped.has(m.food_id))return;
    const g=adjGrams(m)*c.f;perDay[m.food_id]=(perDay[m.food_id]||0)+g;
    const eaten=S.flog.some(l=>l.meal_name===it[0].name);if(!eaten&&nextNeed[m.food_id]==null)nextNeed[m.food_id]=g}));
  Object.keys(perDay).forEach(id=>{const f=S.foods.find(x=>x.id===+id),rem=(S.batches||[]).filter(b=>b.food_id===+id).reduce((a,b)=>a+(+b.remaining_g||0),0),need=perDay[id],days=need>0?rem/need:null;
    const nn=nextNeed[id]||0;
    out.push({kind:'plate',cook:cookInfo(f).cook,name:f.name.replace(/\s*\(.*\)/,''),rem,need,days,run:days!=null?addDays(T,Math.floor(days)):null,empty:rem<Math.max(nn,need*0.5),low:days!=null&&days<2,nextNeed:nn})});
  if(isCycle()){
    const pl=activePlan();
    Object.keys(pl.config.types).forEach(ty=>{
      const rows=(S.allMeals||[]).filter(m=>m.plan_id===pl.id&&m.day_type===ty&&(m.mode||'plate')==='box');
      [...new Set(rows.map(r=>r.meal_no))].forEach(no=>{
        const nm=rows.find(r=>r.meal_no===no).name,n=S.fz.filter(x=>x.meal_no===no&&x.day_type===ty).reduce((a,x)=>a+(+x.portions||0),0),need=[...Array(7)].filter((_,i)=>typeOn(addDays(T,i))===ty).length,eatenToday=typeOn(T)===ty&&S.flog.some(l=>l.meal_name===nm);
        if(!S.fz.length&&!(S.batches||[]).length)return;
        out.push({kind:'box',name:nm+' · '+TYPE_LBL[ty]+'-Boxen',rem:n,days:n,run:addDays(T,n),empty:n<=0&&need>0&&!eatenToday,low:n>0&&n<need&&n<=1,unit:'Stück'});
      });
    });
  }else{
    const box=gs.filter(([no,it])=>mealMode(it)==='box');
    box.forEach(([no,it])=>{const z=S.fz.filter(x=>x.meal_no===+no),n=z.reduce((a,x)=>a+(+x.portions||0),0),eatenToday=S.flog.some(l=>l.meal_name===it[0].name);
      if(!S.fz.length&&!(S.batches||[]).length)return;
      out.push({kind:'box',name:it[0].name+' (Boxen)',rem:n,days:n,run:addDays(T,Math.max(0,n-(eatenToday?0:0))),empty:n<=0&&!eatenToday,low:n>0&&n<=2,unit:'Stück'})});
  }
  return out;
}

}

function parseDate(str){

  if((m=/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/.exec(str))){
    const d=+m[1],mo=+m[2];let y=m[3]?+m[3]:null;if(y!=null&&y<100)y+=2000;
    if(y==null){y=new Date().getFullYear();if(new Date(y,mo-1,d)>new Date(Date.now()+864e5))y--}
    const dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
    return dt.toLocaleDateString('en-CA');

}

// Aktionen der KI in konkrete Schreib-Operationen übersetzen (für Vorschau und Ausführung gleich)
function coachBuild(actions){
  const ops=[],issues=[],T=today();
  const meal=no=>S.meals.filter(m=>m.meal_no===no),nmOf=no=>{const it=meal(no);return it.length?it[0].name:null};
  const planNames=new Set(mealGroups().map(([no,it])=>it[0].name));
  const row=(nm,o)=>({meal_name:nm,day:T,food_id:null,grams:null,...o});
  for(const a of (actions||[])){
    const t=a.typ,no=a.meal_no,items=no!=null?meal(no):[],nm=items.length?items[0].name:null;
    if(['eat_meal','skip_meal','replace_meal','unlog_meal'].includes(t)&&!nm){issues.push('Mahlzeit Nr. '+no+' gibt es nicht.');continue}
    if(t==='skip_meal')ops.push({k:'meal',nm,txt:nm+': ausgelassen',rows:[row(nm,{grams:0,kcal:0,protein:0,carbs:0,fat:0,source:{skipped:true}})]});
    else if(t==='replace_meal'){
      const x={k:Math.max(0,+a.kcal||0),p:Math.max(0,+a.protein||0),c:Math.max(0,+a.carbs||0),f:Math.max(0,+a.fat||0)},lb=(a.bezeichnung||'Ersatz').slice(0,60);
      if(!(x.k>0)){issues.push('Ersatz für '+nm+' hat keine Kcal.');continue}
      ops.push({k:'meal',nm,txt:`${nm}: ersetzt durch ${lb} (${Math.round(x.k)} kcal, P${Math.round(x.p)} C${Math.round(x.c)} F${Math.round(x.f)})`,rows:[row(nm,{kcal:x.k,protein:x.p,carbs:x.c,fat:x.f,source:{replaced:lb}})]});
    }
    else if(t==='log_extra'){
      const x={k:Math.max(0,+a.kcal||0),p:Math.max(0,+a.protein||0),c:Math.max(0,+a.carbs||0),f:Math.max(0,+a.fat||0)};let lb=(a.bezeichnung||'Extra').slice(0,60);
      if(planNames.has(lb)||lb==='Proteinmilch')lb+=' (extra)';
      if(!(x.k>0)){issues.push('Extra "'+lb+'" hat keine Kcal.');continue}
      ops.push({k:'add',nm:lb,txt:`Extra: ${lb} (${Math.round(x.k)} kcal, P${Math.round(x.p)} C${Math.round(x.c)} F${Math.round(x.f)})`,rows:[row(lb,{kcal:x.k,protein:x.p,carbs:x.c,fat:x.f,source:{extra:true}})]});
    }
    else if(t==='set_milk'){const ml=Math.max(0,Math.round(+a.ml||0));ops.push({k:'milk',ml,txt:'Proteinmilch: '+ml+' ml'+(ml===0?' (nicht getrunken)':'')})}
    else if(t==='unlog_meal')ops.push({k:'unlog',no,nm,txt:nm+': wieder offen'});
    else if(t==='eat_meal'){
      const mode=mealMode(items),over={};(a.items||[]).forEach(i=>{over[i.food_id]=Math.max(0,+i.grams||0)});
      const rows=[],used={},notes=[];
      const useBox=mode==='box'&&!(a.items||[]).length&&fzFor(no).some(x=>x.portions>0);
      if(useBox){
        const z=fzFor(no).find(x=>x.portions>0);
        if(z&&z.kcal!=null){rows.push(row(nm,{grams:z.box_g,kcal:z.kcal,protein:z.protein,carbs:z.carbs,fat:z.fat,source:{stock:z.id}}));ops.push({k:'meal',nm,fz:z,txt:nm+': gegessen wie geplant',rows});continue}
      }
      for(const m of items){
        const f=m.foods,ci=cookInfo(f),plan=Math.round(adjGrams(m)*ci.f),g=over[m.food_id]!=null?over[m.food_id]:plan;
        if(over[m.food_id]!=null&&Math.round(g)!==plan)notes.push(`${f.name.replace(/\s*\(.*\)/,'')} ${Math.round(g)} g statt ${plan} g`);
        if(g<=0)continue;
        const x=perFood(f,g/ci.f),take=[];let left=g;
        if(mode==='plate')for(const bb of (S.batches||[]).filter(y=>y.food_id===m.food_id&&+y.remaining_g>0).sort((u,v)=>u.id-v.id)){if(left<=0)break;const q=Math.min(left,+bb.remaining_g-(used[bb.id]||0));if(q>0){take.push({id:bb.id,g:Math.round(q*10)/10});used[bb.id]=(used[bb.id]||0)+q;left-=q}}
        rows.push(row(nm,{food_id:f.id,grams:g,kcal:x.k,protein:x.p,carbs:x.c,fat:x.f,source:take.length?{batches:take}:null}));
      }
      Object.keys(over).forEach(id=>{if(!items.some(m=>m.food_id===+id)){const f=S.foods.find(y=>y.id===+id);if(f&&over[id]>0){const x=perFood(f,over[id]/cookInfo(f).f);rows.push(row(nm,{food_id:f.id,grams:over[id],kcal:x.k,protein:x.p,carbs:x.c,fat:x.f,source:{extra:true}}));notes.push('+ '+f.name.replace(/\s*\(.*\)/,'')+' '+Math.round(over[id])+' g')}}});
      if(!rows.length){issues.push(nm+': nichts gegessen, bitte als ausgelassen vorschlagen.');continue}
      ops.push({k:'meal',nm,used,txt:nm+': gegessen'+(notes.length?' ('+notes.join(', ')+')':' wie geplant'),rows});
    }
    else issues.push('Unbekannte Aktion: '+t);
  }
  return{ops,issues};
}
// Vorschau: so würde der Tag danach aussehen (ohne zu speichern)
function coachSim(ops){
  const sf=S.flog,sm=S.milk;let fl=[...sf],milk=sm;
  const before=eaten();
  try{
    ops.forEach(o=>{
      if(o.k==='meal'){fl=fl.filter(l=>l.meal_name!==o.nm);o.rows.forEach((r,i)=>fl.push({id:-100-i,...r}))}
      else if(o.k==='add')o.rows.forEach((r,i)=>fl.push({id:-200-i,...r}));
      else if(o.k==='unlog')fl=fl.filter(l=>l.meal_name!==o.nm);
      else if(o.k==='milk'){fl=fl.filter(l=>l.meal_name!=='Proteinmilch');milk=[{day:today(),ml:o.ml}];if(o.ml>0&&milkFood()){const m=milkMacros(o.ml);fl.push({id:-300,meal_name:'Proteinmilch',kcal:m.k,protein:m.p,carbs:m.c,fat:m.f})}}
    });
    S.flog=fl;S.milk=milk;BAL.key=null;
    const after=eaten(),b=balanceCalc(),T=targets();
    return{before,after,dev:b.devs,short:b.short||0,lines:b.lines.slice(),T};
  }finally{S.flog=sf;S.milk=sm;BAL.key=null}
}

function planBuild(actions){
  const ops=[],issues=[],txt=[];
  let items=S.meals.map(m=>({...m}));
  const first=no=>items.find(m=>m.meal_no===no);
  const nm=f=>f.name.replace(/\s*\(.*\)/,'');
  for(const a of (actions||[])){
    const t=a.typ,no=a.meal_no,f=a.food_id!=null?S.foods.find(x=>x.id===a.food_id):null;
    if(t==='set_kcal'){
      const k=Math.round(+a.kcal||0);if(k<1200||k>5500){issues.push('Kcal-Ziel '+a.kcal+' ist nicht sinnvoll.');continue}
      ops.push({k:'kcal',kcal:k});txt.push('Kcal-Ziel: '+(S.set.kcal_target||'–')+' → '+k+' kcal');continue;
    }
    if(t==='set_block'){
      const bb=S.set.bench_block;if(!bb){issues.push('Kein Bank-Block vorhanden.');continue}
      const nb={...bb};let msg=[];
      if(a.orm>=40&&a.orm<=400&&+a.orm!==+bb.orm){nb.orm=Math.round(a.orm*2)/2;msg.push('1RM '+bb.orm+' → '+nb.orm+' kg')}
      if(a.phase==='deload'){nb.start=addDays(today(),-28);msg.push('Deload-Woche jetzt')}
      else if(a.phase==='test'){nb.start=addDays(today(),-35);msg.push('Test-Woche jetzt')}
      else if(a.phase==='restart'){nb.start=today();msg.push('Neuer Block ab heute (Woche 1)')}
      if(!msg.length)continue;
      ops.push({k:'block',cfg:nb});txt.push('Bank-Block: '+msg.join(', ')+(a.grund?' ('+a.grund+')':''));continue;
    }
    if(t==='shift_cycle'){
      if(!isCycle()){issues.push('Kein Carb-Cycling-Plan aktiv.');continue}
      const pc=Math.round(+a.prozent||0);if(!pc||Math.abs(pc)>10){issues.push('Verschiebung '+a.prozent+' % ist ungültig (höchstens ±10 %).');continue}
      const cfg=JSON.parse(JSON.stringify(activePlan().config));Object.values(cfg.types).forEach(tt=>{tt.kcal=Math.round(tt.kcal*(1+pc/100)/25)*25});
      const g=genCycle(cfg);if(g.err){issues.push(g.err);continue}
      ops.push({k:'shift',cfg,rows:g.rows});
      txt.push(`Carb Cycling: alle Tage ${pc>0?'+':''}${pc} % (${Object.entries(cfg.types).map(([k,v])=>TYPE_SHORT[k]+' '+v.kcal).join(', ')}), Wochenschnitt ca. ${g.proj.avg} kcal, rechnerisch ca. ${g.proj.kgWeek} kg/Woche. Die Mengen werden neu berechnet, eigene Änderungen daran gehen verloren.`);continue;
    }
    if(t==='set_forecast'){
      const nmF=String(a.exercise||''),isW=/körpergewicht|gewicht/i.test(nmF),e=isW?null:S.ex.find(x=>x.name.toLowerCase()===nmF.toLowerCase());
      if(!isW&&!e){issues.push('Prognose: Übung "'+nmF+'" nicht gefunden.');continue}
      const key=isW?'Körpergewicht':e.name,c={};
      if(a.slope_kg_week!=null&&!isNaN(+a.slope_kg_week)){const v=+a.slope_kg_week;if((isW&&Math.abs(v)<=3)||(!isW&&v>0&&v<=30))c.slope_kg_week=Math.round(v*100)/100;else{issues.push('Prognose-Steigung '+v+' kg/Woche ist ungültig.');continue}}
      if(a.slow_factor>=0.2&&a.slow_factor<=1)c.slow_factor=Math.round(a.slow_factor*100)/100;
      if(a.window_weeks>=3&&a.window_weeks<=16)c.window_weeks=Math.round(a.window_weeks);
      if(!Object.keys(c).length)continue;
      if(a.grund)c.grund=String(a.grund).slice(0,120);
      ops.push({k:'fc',name:key,cfg:c});
      txt.push(`Prognose ${key}: ${c.slope_kg_week!=null?(c.slope_kg_week>0?'+':'')+nf(c.slope_kg_week)+' kg/Woche':'Trend wie bisher'}${c.slow_factor?', späte Grenze ×'+c.slow_factor:''}${c.window_weeks?', Basis '+c.window_weeks+' Wochen':''}${c.grund?' ('+c.grund+')':''}`);continue;
    }
    if(t==='set_exercise'){
      const e=S.ex.find(x=>x.name.toLowerCase()===String(a.exercise||'').toLowerCase());
      if(!e){issues.push('Übung "'+a.exercise+'" nicht gefunden.');continue}
      const pt={};if(a.sets>0)pt.sets=Math.round(a.sets);if(a.rep_min>0)pt.rep_min=Math.round(a.rep_min);if(a.rep_max>0)pt.rep_max=Math.round(a.rep_max);if(a.inc_kg>0)pt.inc_kg=Math.round(a.inc_kg*100)/100;

      ops.push({k:'ex',id:e.id,patch:pt});
      txt.push(e.name+': '+[pt.sets&&pt.sets+' Sätze',(pt.rep_min||pt.rep_max)&&(pt.rep_min||e.rep_min)+'–'+(pt.rep_max||e.rep_max)+' Wdh',pt.inc_kg&&'Schritt '+pt.inc_kg+' kg'].filter(Boolean).join(', '));continue;
    }
    if(!first(no)){issues.push('Mahlzeit Nr. '+no+' gibt es nicht.');continue}
    const mn=first(no).name;
    if(t==='set_meal_time'){if(!/^\d{1,2}:\d{2}$/.test(a.zeit||'')){issues.push('Uhrzeit ungültig.');continue}const z=a.zeit.padStart(5,'0');ops.push({k:'time',no,time:z});txt.push(mn+': Zeit '+z);continue}
    if(!f){issues.push('Lebensmittel Nr. '+a.food_id+' gibt es nicht.');continue}
    if(t==='adjust_meal_item'){
      const it=items.find(m=>m.meal_no===no&&m.food_id===a.food_id),g=Math.round((+a.grams||0)/5)*5;
      if(!it){issues.push(nm(f)+' steckt nicht in '+mn+'.');continue}

    }
    if(t==='set_item_grams'){
      const it=items.find(m=>m.meal_no===no&&m.food_id===a.food_id),g=Math.round((+a.grams||0)*10)/10;
      if(!it){issues.push(nm(f)+' steckt nicht in '+mn+'.');continue}
      if(!(g>0)){issues.push('Menge für '+nm(f)+' ungültig, zum Entfernen "remove_item" nutzen.');continue}
      txt.push(`${mn}: ${nm(f)} ${it.grams} g → ${g} g`);ops.push({k:'grams',id:it.id,grams:g});it.grams=g;
    }else if(t==='add_item'){
      const g=Math.round((+a.grams||0)*10)/10;if(!(g>0)){issues.push('Menge für '+nm(f)+' ungültig.');continue}
      if(items.some(m=>m.meal_no===no&&m.food_id===a.food_id)){issues.push(nm(f)+' steckt schon in '+mn+', bitte Menge ändern statt hinzufügen.');continue}
      const fm=first(no);

      ops.push({k:'add',row:{meal_no:no,name:fm.name,time_of_day:fm.time_of_day,food_id:f.id,grams:g,mode:fm.mode||null,plan_id:activePlan().id,day_type:fm.day_type||null,plan_phase:planPhaseKey()}});
      items.push({id:-1-ops.length,meal_no:no,name:fm.name,time_of_day:fm.time_of_day,food_id:f.id,grams:g,foods:f});
    }else if(t==='remove_item'){
      const it=items.find(m=>m.meal_no===no&&m.food_id===a.food_id);

  return{ops,issues,txt,items};

function planCheck(items,kcalOp){

  if(tgtF&&tot.f>tgtF+8)w.push(`Fett ${Math.round(tot.f)} g liegt über dem Ziel von ${tgtF} g.`);

async function planSend(text){
  const el=document.getElementById('pin');const t=(text!=null?text:(el?el.value:'')).trim();if(!t||PLANAI.busy)return;
  PLANAI.msgs.push({r:'user',t});PLANAI.busy=true;paiRender();
  const history=PLANAI.msgs.slice(0,-1).filter(m=>m.t).slice(-6).map(m=>({role:m.r==='user'?'user':'assistant',content:m.t}));
  try{
    const ctx=await planCtx(t),j=await coachCall('plan',t,history,ctx);
    PLANAI.msgs.push({r:'ai',t:j.proposal?(j.proposal.zusammenfassung||'Vorschlag'):(j.text||'Okay.'),prop:j.proposal||null});
  }catch(e){
    PLANAI.busy=false;
    if(e.status===503){PLANAI.msgs.pop();aiSetupModal();return}
    PLANAI.msgs.push({r:'ai',t:'Das hat nicht geklappt: '+e.message});
  }

}

async function applyPlanOps(ops){
  const todayItems={},fcNew={};
  for(const o of ops){
    if(o.k==='grams')await patch('meal_plan','id=eq.'+o.id,{grams:o.grams});
    else if(o.k==='add')await post('meal_plan',o.row);
    else if(o.k==='del')await del('meal_plan','id=eq.'+o.id);
    else if(o.k==='time')await patch('meal_plan','meal_no=eq.'+o.no,{time_of_day:o.time});
    else if(o.k==='ex')await patch('plan_exercises','id=eq.'+o.id,o.patch);
    else if(o.k==='block')await patch('settings','device_key=eq.'+KEY,{bench_block:o.cfg});
    else if(o.k==='shift'){const pl=activePlan();await patch('meal_plans','id=eq.'+pl.id,{config:o.cfg});await del('meal_plan','plan_id=eq.'+pl.id);await post('meal_plan',o.rows.map(x=>({...x,plan_id:pl.id,plan_phase:'cut'})))}
    else if(o.k==='fc')fcNew[o.name]={...((S.set.forecast_cfg||{})[o.name]||{}),...o.cfg};
    else if(o.k==='today')todayItems[o.id]=o.grams;
    else if(o.k==='kcal'){
      const old=S.set.kcal_target,pk={...(S.set.phase_kcal||{}),[S.set.phase]:o.kcal};
      await patch('settings','device_key=eq.'+KEY,{kcal_target:o.kcal,phase_kcal:pk});
      await post('kcal_history',{old_kcal:old,new_kcal:o.kcal,reason:'KI',status:'angenommen'});
    }
  }
  if(Object.keys(fcNew).length)await patch('settings','device_key=eq.'+KEY,{forecast_cfg:{...(S.set.forecast_cfg||{}),...fcNew}});
  if(Object.keys(todayItems).length){
    const row=adjRow(),items={...((row&&row.data&&row.data.items)||{}),...todayItems};
    if(row)await patch('day_adjustments','id=eq.'+row.id,{data:{...row.data,items}});
    else await post('day_adjustments',{day:today(),kind:'meals',data:{replaced:[],items,changes:['KI-Anpassung der offenen Mahlzeiten']},note:'KI-Anpassung'});
  }
}
async function planApply(i){
  const m=PLANAI.msgs[i];if(!m||!m.prop||m.applied)return;
  const {ops}=planBuild(m.prop.aktionen);if(!ops.length)return;
  m.applied=true;
  await run(async()=>{await applyPlanOps(ops);await load();render()});
  paiRender();
}

async function reviewCall(kind,ctx,extra){
  const r=await fetch(URL_+'/functions/v1/ai-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:KEY,kind,ctx,...(extra||{})})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||('Fehler '+r.status));e.status=r.status;throw e}
  return j.review;
}
async function autoReview(kind,ctx,ref,manual){
  if(AUTO.busy)return null;AUTO.busy=true;
  try{
    LS.set('ai_n_'+today(),String(lsn('ai_n_'+today())+1));
    const rv=await reviewCall(kind,ctx);
    if(kind==='check'&&rv.ok&&!manual)return rv;
    const body={ok:!!rv.ok,summary:rv.zusammenfassung||'',punkte:rv.punkte||[],aktionen:rv.aktionen||[],prognosen:rv.prognosen||[]};
    await post('ai_insights',{day:today(),kind,ref:ref||null,title:rv.titel||'',body,status:(rv.ok&&!manual&&kind!=='training'&&kind!=='progress')?'done':'new'});
    await loadIns();return rv;
  }catch(e){if(e.status===503)AUTO.off=Date.now()+6*3600e3;if(manual)throw e;return null}
  finally{AUTO.busy=false}
}
